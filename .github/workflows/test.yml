name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Matches go.mod requirement approximately (1.25 is very new, using latest stable usually fine or stick to standard)
          # Note: user has go 1.25 in go.mod. GitHub actions might not have 1.25 explicitly named yet if it's cutting edge, 
          # but usually setup-go supports "stable". Let's use "stable" or "1.24" if 1.25 is strict.
          # Actually, let's just use "stable" to be safe.
          go-version-file: 'go/go.mod' # Best practice: use version from go.mod
          cache: true
          cache-dependency-path: go/go.sum

      - name: Install Dependencies
        working-directory: ./go
        run: go mod download

      - name: Run Tests
        working-directory: ./go
        # -v for verbose output
        # ./... to run all tests in all subdirectories
        run: go test -v ./...
