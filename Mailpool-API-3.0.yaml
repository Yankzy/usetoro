    MailboxError:
      type: object
      title: MailboxError
      description: Details about why a mailbox is `inactive`. This object is only
        present when the mailbox `status` is `inactive` and an error code has been
        assigned.
      properties:
        code:
          type: integer
          enum:
          - 101
          - 201
          - 202
          - 301
          - 401
          - 402
          description: "Machine-readable error code (`MailboxErrorCode`). Codes are\
            \ grouped by the hundreds digit:\n\n**1xx \u2014 Domain-related errors**\n\
            - `101` DomainAlreadyInUse \u2014 The domain is already in use in Google\
            \ Workspace.\n\n**2xx \u2014 Admin account access errors**\n- `201` AdminTwoFactorChanged\
            \ \u2014 The admin two-factor authentication was changed.\n- `202` AdminPasswordChanged\
            \ \u2014 The admin password was changed.\n\n**3xx \u2014 Domain registration\
            \ errors**\n- `301` InvalidDomain \u2014 The domain is invalid.\n\n**4xx\
            \ \u2014 Account-level errors**\n- `401` AccountDisabledForSpam \u2014\
            \ The account was disabled for sending spam.\n- `402` AdminAccountDisabledForSpam\
            \ \u2014 The admin account was disabled for sending spam."
          examples:
          - 401
        message:
          type: string
          description: Human-readable description of the error.
          examples:
          - Account disabled for sending spam on domain example.com.
      required:
      - code
      - message
      examples:
      - code: 401
        message: Account disabled for sending spam on domain example.com.
