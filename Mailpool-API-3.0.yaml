  /mailboxes/bulk-delete-immediately:
    post:
      tags:
      - Mailboxes
      summary: Bulk delete mailboxes immediately
      description: 'Delete up to 10 mailboxes immediately, bypassing the standard

        scheduled-deletion grace period used by `DELETE /mailboxes/{mailboxId}`.


        Each mailbox is validated before any deletion happens: it must

        belong to the current workspace and be either `active`, or

        `inactive`. If any mailbox fails validation

        the request is rejected and no deletions are performed.

        '
      operationId: post-mailboxes-bulk-delete-immediately
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mailboxIds:
                  type: array
                  description: 'IDs of the mailboxes to delete immediately. Must

                    contain between 1 and 10 unique positive integers;

                    duplicates are removed server-side.

                    '
                  minItems: 1
                  maxItems: 10
                  items:
                    type: integer
                    minimum: 1
              required:
              - mailboxIds
            examples:
              Example 1:
                value:
                  mailboxIds:
                  - 789
                  - 790
                  - 791
      responses:
        '201':
          description: 'Mailboxes were deleted immediately. The response contains
            the

            final state of each requested mailbox after deletion, in the

            same order as the `mailboxIds` request body (with duplicates

            removed).

            '
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mailbox'
        '400':
          description: 'Invalid request body or at least one mailbox cannot be deleted

            in its current status (`Mailbox with id {id} cannot be deleted

            in its current status`). `mailboxIds` must contain between

            1 and 10 unique positive integers.

            '
        '403':
          description: 'Immediate mailbox deletion is not enabled for this workspace

            (`Immediately mailbox deletion is not enabled for this

            workspace`).

            '
        '404':
          description: 'At least one of the provided mailboxes was not found in the

            current workspace (`Mailbox with id {id} not found`).

            '
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
