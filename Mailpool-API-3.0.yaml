    RenewDomainListItem:
      type: object
      title: RenewDomainListItem
      description: 'Domain entry returned by `GET /domains/renew/domains`. Use the
        `id` of any

        item from this list as a `domainIds` value for the renewal price and

        submit endpoints.

        '
      properties:
        id:
          type: number
          description: Domain ID.
        createdAt:
          type: string
          description: When the domain record was created in Mailpool.
          format: date-time
        domain:
          type: string
          description: Fully qualified domain name (e.g. `example.com`).
        status:
          type: string
          description: 'Lowercased domain status (e.g. `active`, `pending`, `inactive`).

            '
        registeredAt:
          type: string
          description: When the domain was originally registered with the registrar.
          format: date-time
        renewedAt:
          type: string
          description: Timestamp of the latest successful renewal, if any.
          format: date-time
          nullable: true
        expireAt:
          type: string
          description: Domain expiration date.
          format: date-time
        renewInProgress:
          type: boolean
          description: '`true` while the most recent renewal for this domain is still
            in progress

            (status `InProgress` or `AwaitingPayment`) or queued for manual handling.

            Frontend clients should disable a "Renew" action while this is `true`.

            '
        requiresManualRenewal:
          type: boolean
          description: "Present and `true` only when the domain provider does not\
            \ support\nautomatic renewal. Submitting such\na domain to `POST /domains/renew`\
            \ still works, but no auto-renew order\nis created \u2014 the renewal\
            \ is forwarded to the Mailpool team for manual\nprocessing.\n"
      required:
      - id
      - createdAt
      - domain
      - status
      - registeredAt
      - renewInProgress
      examples:
      - id: 123456
        createdAt: '2024-11-25T10:00:00Z'
        domain: example.com
        status: active
        registeredAt: '2024-11-25T10:00:00Z'
        renewedAt: null
        expireAt: '2025-11-25T10:00:00Z'
        renewInProgress: false
      - id: 789101
        createdAt: '2024-08-10T09:00:00Z'
        domain: mywebsite.org
        status: active
        registeredAt: '2024-08-10T09:00:00Z'
        renewedAt: '2025-08-10T09:00:00Z'
        expireAt: '2026-08-10T09:00:00Z'
        renewInProgress: true
        requiresManualRenewal: true
    RenewDomainPriceItem:
      type: object
      title: RenewDomainPriceItem
      description: "Per-domain renewal price entry returned by `GET /domains/renew/prices`.\n\
        One item is returned for every `domainId` from the request (de-duplicated),\n\
        including domains that cannot be priced \u2014 those will have `price: null`\n\
        and either `requiresManualRenewal: true` or an `error` string.\n"
      properties:
        domainId:
          type: number
          description: Domain ID echoed from the request.
        domain:
          type: string
          description: 'Fully qualified domain name. `null` when the supplied `domainId`
            was

            not found in the current workspace.

            '
          nullable: true
        price:
          type: number
          description: 'Renewal price in the workspace currency for one renewal period

            (typically one year). `null` when a price could not be fetched

            (e.g. the domain requires manual renewal or the provider returned

            an error described in `error`).

            '
          nullable: true
        requiresManualRenewal:
          type: boolean
          description: 'Present and `true` only when the domain provider does not
            support

            automatic renewal pricing.

            '
        error:
          type: string
          description: "Human-readable error message when the price for this specific\
            \ domain\ncould not be retrieved. Other items in the same response remain\n\
            valid \u2014 this endpoint never fails the whole batch because of a\n\
            single bad item.\n"
      required:
      - domainId
      examples:
      - domainId: 123456
        domain: example.com
        price: 14.99
      - domainId: 789101
        domain: mywebsite.org
        price: null
        requiresManualRenewal: true
      - domainId: 999999
        domain: null
        price: null
        error: Domain not found
    RenewOrder:
      type: object
      title: RenewOrder
      description: 'Snapshot of a domain renewal order created by `POST /domains/renew`.

        Use `GET /domains/renew/orders/{orderId}` to poll its progress.

        '
      properties:
        orderId:
          type: number
          description: Renewal order ID.
        status:
          type: string
          enum:
          - Created
          - AwaitingPayment
          - InProgress
          - Completed
          - Failed
          description: "Aggregated order status:\n* `Created` \u2014 the order has\
            \ been recorded but renewals have not yet started.\n* `AwaitingPayment`\
            \ \u2014 the order needs a payment to be confirmed.\n* `InProgress` \u2014\
            \ at least one domain in the order is still being renewed.\n* `Completed`\
            \ \u2014 every domain in the order renewed successfully.\n* `Failed` \u2014\
            \ at least one domain in the order failed to renew.\n"
        totalPrice:
          type: number
          description: 'Total order price in the workspace currency. `null` until
            the order

            total has been finalized by the provider.

            '
          nullable: true
        domains:
          type: array
          description: Per-domain renewal items inside the order.
          items:
            $ref: '#/components/schemas/RenewOrderDomain'
      required:
      - orderId
      - status
      - domains
      examples:
      - orderId: 42
        status: InProgress
        totalPrice: 29.98
        domains:
        - domainId: 123456
          domain: example.com
          status: Completed
        - domainId: 789101
          domain: mywebsite.org
          status: InProgress
    RenewOrderDomain:
      type: object
      title: RenewOrderDomain
      description: Single domain entry inside a renewal order snapshot.
      properties:
        domainId:
          type: number
          description: Domain ID.
        domain:
          type: string
          description: Fully qualified domain name.
        status:
          type: string
          enum:
          - InProgress
          - Completed
          - Failed
          - Manual
          description: 'Per-domain renewal status inside the order. `Manual` means
            the renewal

            was forwarded to the Mailpool team for manual processing because the

            domain provider does not support automatic renewal.

            '
      required:
      - domainId
      - domain
      - status
      examples:
      - domainId: 123456
        domain: example.com
        status: Completed
      - domainId: 789101
        domain: mywebsite.org
        status: InProgress
