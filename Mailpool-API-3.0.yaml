    SavePlatformCredentials:
      type: object
      title: SavePlatformCredentials
      description: 'Request body for saving or updating stored credentials for a third-party

        platform. Credentials are validated against the platform before they are

        stored; invalid credentials result in a `400 Bad Request`.

        '
      properties:
        platform:
          $ref: '#/components/schemas/AutomationExportPlatform'
          description: Platform the credentials belong to.
        credentials:
          $ref: '#/components/schemas/PlatformCredentialsData'
          description: Credential fields (plaintext).
      required:
      - platform
      - credentials
      examples:
      - platform: instantly
        credentials:
          apiKey: sk_live_1234567890abcd
      - platform: warmbox
        credentials:
          email: user@example.com
          password: super-secret-password
    AutomationExportPlatform:
      type: string
      enum:
      - instantly
      - smartlead
      - reachinbox
      - reply
      - saleshandy
      - warmbox
      - emelia
      - lemlist
      - plusvibe
      title: AutomationExportPlatform
      description: 'Subset of `ExportPlatform` values that can be used for automated
        mailbox export

        (i.e. direct push to the third-party platform via stored credentials). Use

        `csv` with the CSV export endpoint to retrieve a downloadable file instead.

        '
      examples:
      - instantly
      - smartlead
      - warmbox
    PlatformCredentialsData:
      type: object
      title: PlatformCredentialsData
      description: 'Credential fields used to authenticate against a third-party platform.

        The exact subset required depends on the platform (some require `apiKey`,

        others require `email`/`password`). In responses secret values are masked

        and only the last 4 characters are returned (e.g. `****abcd`).

        '
      properties:
        email:
          type: string
          description: Account email, when the platform authenticates with credentials.
          format: email
        apiKey:
          type: string
          description: API key. Returned masked (e.g. `****abcd`) from `GET` endpoints.
        password:
          type: string
          description: Account password. Returned masked (e.g. `****abcd`) from `GET`
            endpoints.
      examples:
      - email: user@example.com
        apiKey: sk_live_1234567890abcd
      - email: user@example.com
        password: '********'
    PlatformCredentials:
      type: object
      title: PlatformCredentials
      description: Stored credentials for a third-party platform, with secrets masked.
      properties:
        platform:
          $ref: '#/components/schemas/ExportPlatform'
          description: Platform the credentials belong to.
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the credentials were saved.
          format: date-time
        data:
          $ref: '#/components/schemas/PlatformCredentialsData'
          description: Credential fields (secret values are masked).
      required:
      - platform
      - createdAt
      - data
      examples:
      - platform: instantly
        createdAt: '2026-04-21T10:00:00Z'
        data:
          email: user@example.com
          apiKey: '****abcd'
    ExportPlatform:
      type: string
      enum:
      - instantly
      - smartlead
      - reachinbox
      - firstquadrant
      - luna
      - saleshandy
      - reply
      - warmbox
      - smartreach
      - manyreach
      - plusvibe
      - woodpecker
      - emelia
      - lemlist
      - csv
      title: ExportPlatform
      description: Third-party platform identifier that a mailbox export is targeted
        at.
      examples:
      - instantly
      - smartlead
      - warmbox
    ExportMailboxesRequest:
      type: object
      title: ExportMailboxesRequest
      description: 'Request body used to push a list of mailboxes to a third-party
        platform using

        stored credentials. Credentials for the selected platform must already have

        been saved via `POST /exports/credentials`.

        '
      properties:
        platform:
          $ref: '#/components/schemas/AutomationExportPlatform'
          description: Target platform.
        mailboxIds:
          type: array
          description: 'IDs of mailboxes to include in the export batch. Must contain
            at least

            one ID. Mailboxes whose inbox type is not supported by the target

            platform are reported in the response `errors` array and skipped; if

            none of the provided mailboxes are supported the endpoint returns

            `400 Bad Request`.

            '
          minItems: 1
          items:
            type: number
      required:
      - platform
      - mailboxIds
      examples:
      - platform: instantly
        mailboxIds:
        - 789
        - 790
        - 791
    ExportBatchCreatedResponse:
      type: object
      title: ExportBatchCreatedResponse
      description: "Response returned after a mailbox export batch has been scheduled.\n\
        \nHas the same shape as `ExportBatch` (returned by\n`GET /exports/batches/{batchId}`)\
        \ and additionally includes an `errors`\narray listing mailboxes from the\
        \ request that could not be included in\nthe batch because exporting their\
        \ inbox type to the target platform is\nnot supported. Such mailboxes are\
        \ skipped \u2014 the remaining supported\nmailboxes are still scheduled for\
        \ export. If **none** of the requested\nmailboxes can be exported to the target\
        \ platform the endpoint returns\n`400 Bad Request` instead.\n"
      properties:
        id:
          type: number
          description: Export batch ID. Use it to poll export status.
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the batch was created.
          format: date-time
        status:
          $ref: '#/components/schemas/ExportStatus'
