    DomainStatus:
      type: string
      enum:
      - active
      - pending
      - inactive
      title: DomainStatus
      description: "Current status of the domain.\n\n- `active` \u2014 the domain\
        \ is active and ready to be used.\n- `pending` \u2014 the domain is being\
        \ provisioned and is not ready yet.\n- `inactive` \u2014 the domain has been\
        \ disabled. When a domain is `inactive` because of a problem, the `error`\
        \ field is populated with a `DomainErrorCode` and a human-readable message."
      examples:
      - active
      - pending
      - inactive
    DomainType:
      type: string
      enum:
      - google
      - shared
      - private
      - outlook
      - unassigned
      title: DomainType
      examples:
      - google
      - shared
      - private
      - outlook
      - unassigned
    DomainError:
      type: object
      title: DomainError
      description: Details about why a domain is `inactive`. This object is only present
        when the domain `status` is `inactive` and an error code has been assigned.
      properties:
        code:
          type: integer
          enum:
          - 101
          - 102
          - 103
          - 104
          - 105
          - 201
          - 301
          description: "Machine-readable error code (`DomainErrorCode`). Codes are\
            \ grouped by the hundreds digit:\n\n**1xx \u2014 Disabled by Mailpool**\n\
            - `101` UnauthorizedRedirect \u2014 Domain disabled due to an unauthorized\
            \ redirect.\n- `102` SpamAbuse \u2014 Domain disabled due to spam abuse.\n\
            - `103` TrademarkViolation \u2014 Domain disabled due to a trademark violation.\n\
            - `104` PhishingAbuse \u2014 Domain disabled due to phishing abuse.\n\
            - `105` MalwareAbuse \u2014 Domain disabled due to malware abuse.\n\n\
            **2xx \u2014 Registry issues**\n- `201` OnHoldByRegistry \u2014 Domain\
            \ is on hold by the registry.\n\n**3xx \u2014 Registrar issues**\n- `301`\
            \ TransferredOut \u2014 Domain has been transferred out to another registrar."
          examples:
          - 102
        message:
          type: string
          description: Human-readable description of the error.
          examples:
          - Domain example.com disabled due to spam abuse.
      required:
      - code
      - message
      examples:
      - code: 102
        message: Domain example.com disabled due to spam abuse.
    DomainOwner_2:
