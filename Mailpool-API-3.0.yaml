      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /dummy-webhooks:
    post:
      summary: Dummy endpoint to prevent pruning of webhook schemas
      operationId: ReceiveWebhook
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/DomainsRegistered'
              - $ref: '#/components/schemas/DomainsUpdated'
              - $ref: '#/components/schemas/MailboxesCreated'
              - $ref: '#/components/schemas/MailboxesUpdated'
              - $ref: '#/components/schemas/MailboxesDeleted'
              - $ref: '#/components/schemas/SpamChecksCreated'
              - $ref: '#/components/schemas/SpamChecksUpdated'
              - $ref: '#/components/schemas/SpamChecksDeleted'
              - $ref: '#/components/schemas/IpBlacklistChecksCreated'
              - $ref: '#/components/schemas/IpBlacklistChecksUpdated'
              - $ref: '#/components/schemas/IpBlacklistChecksDeleted'
              - $ref: '#/components/schemas/InboxPlacementsCreated'
              - $ref: '#/components/schemas/InboxPlacementsUpdated'
              - $ref: '#/components/schemas/InboxPlacementsDeleted'
      responses:
        '200':
          description: OK
tags:
- name: Domains
  description: Domain registration, DNS, DMARC, and transfers.
- name: Domain Owners
  description: Saved domain owners (registrant/contact records).
- name: Mailboxes
  description: Mailbox provisioning and lifecycle.
- name: Spam Checks
  description: Spam score and deliverability checks.
- name: IP Blacklist Checks
  description: Standalone IP address blacklist verifications.
- name: Inbox Placements
  description: Inbox placement tests against external providers.
- name: Exports
  description: "Export mailboxes to third-party platforms (Instantly, Smartlead, CSV,\
    \ \u2026)."
- name: Subscriptions
  description: Subscription slot management.
components:
  securitySchemes:
    X-Api-Authorization:
      type: apiKey
      name: X-Api-Authorization
      in: header
  schemas:
    DnsRecord:
      type: object
      title: DnsRecord
      examples:
      - type: A
        key: '@'
        value: 192.0.2.1
      - type: CNAME
        key: app
        value: app.example.com
      anyOf:
      - $ref: '#/components/schemas/ARecord'
      - $ref: '#/components/schemas/AAAARecord'
      - $ref: '#/components/schemas/CNAMERecord'
      - $ref: '#/components/schemas/TXTRecord'
      - $ref: '#/components/schemas/MXRecord'
      - $ref: '#/components/schemas/SRVRecord'
    ARecord:
      type: object
      title: ARecord
      properties:
        type:
          const: A
        key:
          type: string
        value:
          type: string
      required:
      - type
      - value
      examples:
      - type: A
        key: '@'
        value: 192.0.2.1
      - type: A
        key: app
        value: 192.65.1.5
    AAAARecord:
      type: object
      title: AAAARecord
      properties:
        type:
          const: AAAA
        key:
          type: string
        value:
          type: string
      required:
      - type
      - value
      examples:
      - type: AAAA
        key: '@'
        value: 2001:0db8:85a3:0000:0000:8a2e:0370:7334
      - type: AAAA
        key: app
        value: 2001:0db8:85a3:0000:0000:8234:0370:73df
    CNAMERecord:
      type: object
      title: CNAMERecord
      properties:
        type:
          const: CNAME
        key:
          type: string
        value:
          type: string
      required:
      - type
      - value
      examples:
      - type: CNAME
        key: '@'
        value: app.example.com
      - type: CNAME
        key: app
        value: app.example.com
    TXTRecord:
      type: object
      title: TXTRecord
      properties:
        type:
          const: TXT
        key:
          type: string
        value:
          type: string
      required:
      - type
      - value
      examples:
      - type: TXT
        key: example.com
        value: v=spf1 include:_spf.google.com ~all
      - type: TXT
        key: _dmarc.example.org
        value: v=DMARC1; p=quarantine; rua=mailto:dmarc-reports@example.org
    MXRecord:
      type: object
      title: MXRecord
      properties:
        type:
          const: MX
        key:
          type: string
        priority:
          type: number
        value:
          type: string
      required:
      - type
      - priority
      - value
      examples:
      - type: MX
        key: mail.example.com
        priority: 10
        value: mailserver1.example.com
      - type: MX
        key: email.mywebsite.org
        priority: 5
        value: mail.mywebsite.org
    SRVRecord:
      type: object
      title: SRVRecord
      properties:
        type:
          const: SRV
        key:
          type: string
        priority:
          type: number
        weight:
          type: number
        port:
          type: number
        value:
          type: string
      required:
      - type
      - priority
      - weight
      - port
      - value
      examples:
      - type: SRV
        key: _sip._tcp.example.com
        priority: 10
        weight: 5
        port: 5060
        value: sipserver.example.com
      - type: SRV
        key: _xmpp._tcp.chat.example.org
        priority: 20
        weight: 10
        port: 5222
        value: xmppserver.chat.example.org
    Domain:
      type: object
      title: Domain
      properties:
        id:
          type: number
        createdAt:
          type: string
        domain:
          type: string
        domainOwner:
          $ref: '#/components/schemas/DomainOwner'
        redirectUrl:
          type: string
        status:
          $ref: '#/components/schemas/DomainStatus'
        type:
          $ref: '#/components/schemas/DomainType'
        expireAt:
          type: string
        nameservers:
          type: array
          items:
            type: string
        error:
          $ref: '#/components/schemas/DomainError'
      required:
      - id
      - createdAt
      - domain
      - domainOwner
      - status
      examples:
      - id: '123456'
        createdAt: '2024-11-25T10:00:00Z'
