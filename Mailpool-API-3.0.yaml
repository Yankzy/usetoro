openapi: 3.0.0
info:
  version: '1.0'
  title: Mailpool API
  summary: ''
servers:
- url: https://app.mailpool.io/v1/api
  description: ''
paths:
  /domains/suggestions:
    get:
      tags:
      - Domains
      summary: Get Domains Suggestions
      description: List of suggested domains
      operationId: get-domains-suggestions
      parameters:
      - name: domain
        in: query
        description: Base domain for generating suggestions
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Up to 10 suggestions per each request allowed
        required: true
        schema:
          type: number
      - name: offset
        in: query
        description: Offset for paginated response
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Suggested domains
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    domain:
                      type: string
                    price:
                      type: number
                    available:
                      type: boolean
                  required:
                  - domain
                  - available
                x-examples:
                  Example 1:
                  - domain:
                    - test1.com
                    - test2.com
                    price: 3.24
                    status: available
      security:
      - {}
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/info:
    get:
      tags:
      - Domains
      summary: Get domain info
      description: Is the domain available for purchase and its price
      operationId: get-domain-info
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  price:
                    type: number
                required:
                - available
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/{domainId}/dns:
    get:
      tags:
      - Domains
      summary: Get domain DNS Records
      description: Get domain DNS Records
      operationId: get-domains-dns
      parameters:
      - name: domainId
        in: path
        description: Domain ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DnsRecord'
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
    put:
      tags:
      - Domains
      summary: Update domain DNS records
      description: Update domain DNS records
      operationId: put-domains-dns
      parameters:
      - name: domainId
        in: path
        description: Domain ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DnsRecord'
            examples:
              Example 1:
                value:
                - type: A
                  key: string
                  value: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DnsRecord'
                x-examples:
                  Example 1:
                  - type: A
                    key: string
                    value: string
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/:
    get:
      tags:
      - Domains
      summary: Get domains list
      description: Get domains list
      operationId: get-domains
      parameters:
      - name: limit
        in: query
        required: true
        schema:
          type: number
      - name: offset
        in: query
        required: true
        schema:
          type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Domain'
                  total:
                    type: number
                required:
                - data
                - total
              examples:
                Example 1:
                  value:
                    data:
                    - id: '123456'
                      createdAt: '2024-11-25T10:00:00Z'
                      domain: example.com
                      domainOwner:
                        id: '123'
                        company: Tech Innovators Inc.
                        firstName: John
                        lastName: Doe
                        email: john.doe@example.com
                        streetAddress1: 123 Innovation Lane
                        streetAddress2: Suite 200
                        city: San Francisco
                        state: CA
                        postalCode: '94107'
                        country: USA
                        phone: +1 555 000 0000
                      redirectUrl: https://example.com/home
                      status: active
                      type: google
                      expireAt: '2025-11-25T10:00:00Z'
                    total: 0
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
    post:
      tags:
      - Domains
      summary: Register domains
      description: Create domain
      operationId: post-domains
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                domains:
                  type: array
                  items:
                    type: string
                domainOwnerId:
                  type: number
                  description: ID of the existing domain owner. Either `domainOwnerId`
                    or `newDomainOwner` must be provided.
                newDomainOwner:
                  $ref: '#/components/schemas/DomainOwner_2'
                  description: Object containing information about a new domain owner.
                    Either `domainOwnerId` or `newDomainOwner` must be provided.
                redirect:
                  type: string
                dmarcEmail:
                  type: string
                dmarcPolicy:
                  $ref: '#/components/schemas/DmarcPolicy'
                  description: Optional DMARC policy to apply when registering the
                    domains. One of `none`, `quarantine`, or `reject`.
              required:
              - domains
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain_2'
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/{domainId}:
    delete:
      tags:
      - Domains
      summary: Delete domain
      description: Delete domain
      operationId: delete-domains-:domainId
      parameters:
      - name: domainId
        in: path
        description: Domain ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
    get:
      tags:
      - Domains
      summary: Get domain
      operationId: get-domains-domainId
      parameters:
      - name: domainId
        in: path
        description: Domain ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
              examples:
                Example 1:
                  value:
                    id: '123456'
                    createdAt: '2024-11-25T10:00:00Z'
                    domain: example.com
                    expireAt: '2025-11-25T10:00:00Z'
                    domainOwner:
                      id: '123'
                      company: Tech Innovators Inc.
                      firstName: John
                      lastName: Doe
                      email: john.doe@example.com
                      streetAddress1: 123 Innovation Lane
                      streetAddress2: Suite 200
                      city: San Francisco
                      state: CA
                      postalCode: '94107'
                      country: USA
                      phone: +1 555 000 0000
                    redirectUrl: https://example.com/home
                    status: active
                    type: google
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/owners:
    get:
      tags:
      - Domain Owners
      summary: Get saved domains owners
      description: Get domains owners
      operationId: get-domains-owners
      parameters:
      - name: limit
        in: query
        required: true
        schema:
          type: number
      - name: offset
        in: query
        required: true
        schema:
          type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainOwner'
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
    post:
      tags:
      - Domain Owners
      summary: Add saved domain owner
      description: Add domain owner
      operationId: post-domains-owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainOwner_2'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainOwner'
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/owners/{ownerId}:
    put:
      tags:
      - Domain Owners
      summary: Update saved domain owner
      operationId: put-domains-owners-ownerId
      parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainOwner_2'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainOwner'
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
    delete:
      tags:
      - Domain Owners
      summary: Delete saved domain owner
      operationId: delete-domains-owners-ownerId
      parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainOwner'
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/{domainId}/owner:
    put:
      tags:
      - Domain Owners
      summary: Update domain owner for the domain
      operationId: put-domains-domainId-owner
      parameters:
      - name: domainId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainOwner_2'
      responses:
        '200':
          description: OK
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/{domainId}/redirect-url:
    post:
      tags:
      - Domains
      summary: Set redirect URL
      description: Set redirect URL
      operationId: post-domains-redirectUrl
      parameters:
      - name: domainId
        in: path
        description: Domain ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
              required:
              - url
            examples:
              Example 1:
                value:
                  url: https://example.com/home
              Example 2:
                value:
                  url: https://mywebsite.org/dashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/{domainId}/dmarc-email:
    post:
      tags:
      - Domains
      summary: Set DMARC email
      operationId: post-domains-domainId-dmarc-email
      parameters:
      - name: domainId
        in: path
        description: Domain ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
            examples:
              Example 1:
                value:
                  email: john.doe@example.com
              Example 2:
                value:
                  email: emma.smith@globalsolutions.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/{domainId}/dmarc-policy:
    post:
      tags:
      - Domains
      summary: Set DMARC policy
      operationId: post-domains-domainId-dmarc-policy
      parameters:
      - name: domainId
        in: path
        description: Domain ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                policy:
                  $ref: '#/components/schemas/DmarcPolicy'
              required:
              - policy
            examples:
              Example 1:
                value:
                  policy: quarantine
              Example 2:
                value:
                  policy: reject
              Example 3:
                value:
                  policy: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/transfer:
    post:
      tags:
      - Domains
      summary: Domains transfer
      operationId: post-domains-transfer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                domains:
                  type: array
                  items:
                    type: string
              required:
              - domains
            examples:
              Example 1:
                value:
                  domains:
                  - example.com
                  - acme.io
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransferDomainResponse'
              examples:
                Example 1:
                  value:
                  - domain: example.com
                    nameservers:
                    - a.nameserver.com
                    - b.nameservre.com
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/{domainId}/transfer-out/auth-code:
    post:
      tags:
      - Domains
      summary: Get domain transfer-out auth code
      description: 'Request a transfer auth code (EPP code) for a domain so the workspace

        owner can transfer it away from Mailpool to another registrar. The

        domain is also unlocked for transfer as part of this request.


        The domain must:

        * be older than 60 days, and

        * have at least two weeks left before expiration.


        After receiving the auth code you typically call

        `POST /domains/{domainId}/transfer-out/authorize` once the gaining

        registrar initiates the transfer at the registry.

        '
      operationId: post-domains-domainId-transfer-out-auth-code
      parameters:
      - name: domainId
        in: path
        description: Domain ID.
        required: true
        schema:
          type: number
      responses:
        '201':
          description: Auth code generated by the registrar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authCode:
                    type: string
                    description: 'Transfer auth code (EPP code) to provide to the
                      gaining

                      registrar when initiating a transfer of the domain away

                      from Mailpool.

                      '
                required:
                - authCode
              examples:
                Example 1:
                  value:
                    authCode: aB3$kP9!mZ2x
        '400':
          description: "Transfer-out is not available for this domain. Possible reasons:\n\
            * the domain provider does not support transfers\n  (`Domain provider\
            \ does not support transfer`),\n* the domain is younger than 60 days\n\
            \  (`Domain must be older than 60 days`),\n* the domain is within two\
            \ weeks of expiration\n  (`Domain is too close to expiration`),\n* or\
            \ the registrar refused to issue the auth code.\n"
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/{domainId}/transfer-out/authorize:
    post:
      tags:
      - Domains
      summary: Authorize or deny domain transfer-out
      description: 'Approve or deny a pending transfer-out request initiated by the

        gaining registrar.


        On `approve` + a successful registrar response, the domain is marked

        as `inactive` in Mailpool and tagged as transferred out.

        On `deny` the domain stays in the workspace and the registrar locks

        it again for transfers.

        '
      operationId: post-domains-domainId-transfer-out-authorize
      parameters:
      - name: domainId
        in: path
        description: Domain ID.
        required: true
        schema:
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authorize:
                  type: string
                  enum:
                  - approve
                  - deny
                  description: 'Whether to `approve` (release the domain to the gaining

                    registrar) or `deny` (refuse the transfer and re-lock the

                    domain) the pending transfer-out request.

                    '
              required:
              - authorize
            examples:
              Approve:
                value:
                  authorize: approve
              Deny:
                value:
                  authorize: deny
      responses:
        '201':
          description: Decision was forwarded to the registrar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: '`true` when the registrar accepted the decision.
                      When

                      `authorize` is `approve` and `success` is `true`, the

                      domain is marked as inactive in Mailpool and flagged as

                      transferred out.

                      '
                required:
                - success
              examples:
                Approved:
                  value:
                    success: true
                Denied:
                  value:
                    success: true
        '400':
          description: "The decision could not be forwarded. Possible reasons:\n*\
            \ the domain provider does not support transfers\n  (`Domain provider\
            \ does not support transfer`),\n* there is no pending transfer-out request\
            \ to act on, or\n* the registrar rejected the request.\n"
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/google-workspace-availability:
    post:
      tags:
      - Domains
      summary: Check Google Workspace domain availability
      description: 'Check whether a domain is already in use in Google Workspace.


        Mailpool queries Google''s domain-in-use service to determine if the

        domain can still be signed up for Google Workspace. Use this before

        provisioning to detect domains that already belong to an existing

        Google Workspace account.


        This endpoint must be enabled for the workspace; otherwise a `403` is

        returned.

        '
      operationId: post-domains-google-workspace-availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  description: Fully qualified domain name to check.
                  format: hostname
              required:
              - domain
            examples:
              Example 1:
                value:
                  domain: example.com
      responses:
        '201':
          description: Availability result for the domain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  isAvailable:
                    type: boolean
                    description: '`true` when the domain is available to sign up for
                      Google

                      Workspace (i.e. it is not already in use by an existing

                      Google Workspace account). `false` when the domain is

                      already in use in Google Workspace.

                      '
                required:
                - isAvailable
              examples:
                Available:
                  value:
                    isAvailable: true
                Already in use:
                  value:
                    isAvailable: false
        '403':
          description: 'The Google Workspace domain-in-use check is not enabled for
            this

            workspace (`Google Workspace domain-in-use check is not enabled for

            this workspace`).

            '
        '503':
          description: 'The availability check could not be completed (`Failed to
            check

            Google Workspace availability`).

            '
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/renew/domains:
    get:
      tags:
      - Domains
      summary: Get renewable domains list
      description: 'Return a paginated list of domains in the current workspace that
        are

        eligible to appear in the renewal flow. Use the `id` of any returned

        item as a `domainIds` value for `GET /domains/renew/prices` or

        `POST /domains/renew`.

        '
      operationId: get-domains-renew-domains
      parameters:
      - name: limit
        in: query
        description: Maximum number of items to return.
        required: true
        schema:
          type: number
      - name: offset
        in: query
        description: Offset for paginated response.
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Paginated list of domains that can be renewed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RenewDomainListItem'
                  total:
                    type: number
                    description: Total number of renewable domains in the workspace.
                required:
                - data
                - total
              examples:
                Example 1:
                  value:
                    data:
                    - id: 123456
                      createdAt: '2024-11-25T10:00:00Z'
                      domain: example.com
                      status: active
                      registeredAt: '2024-11-25T10:00:00Z'
                      renewedAt: null
                      expireAt: '2025-11-25T10:00:00Z'
                      renewInProgress: false
                    - id: 789101
                      createdAt: '2024-08-10T09:00:00Z'
                      domain: mywebsite.org
                      status: active
                      registeredAt: '2024-08-10T09:00:00Z'
                      renewedAt: '2025-08-10T09:00:00Z'
                      expireAt: '2026-08-10T09:00:00Z'
                      renewInProgress: true
                      requiresManualRenewal: true
                    total: 2
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/renew/prices:
    get:
      tags:
      - Domains
      summary: Get renewal prices for domains
      description: 'Return renewal prices for a list of domains by ID. `domainIds`
        is a

        comma-separated list of positive integers (e.g. `?domainIds=1,2,3`)

        and is automatically de-duplicated on the server.


        The endpoint never fails the whole batch because of a single bad

        item: domains the workspace does not own or that the provider could

        not price are returned with `price: null` and either an `error`

        message or `requiresManualRenewal: true`.

        '
      operationId: get-domains-renew-prices
      parameters:
      - name: domainIds
        in: query
        description: 'Comma-separated list of domain IDs to price (e.g. `1,2,3`).

          Must contain at least one positive integer.

          '
        required: true
        schema:
          type: string
          examples:
          - 123456,789101
        examples:
          default:
            value: 123456,789101
      responses:
        '200':
          description: 'Per-domain renewal price entries. The array always contains
            one

            item per unique requested `domainId`, including unknown or

            non-auto-renewable domains (see `error` / `requiresManualRenewal`).

            '
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RenewDomainPriceItem'
              examples:
                Example 1:
                  value:
                  - domainId: 123456
                    domain: example.com
                    price: 14.99
                  - domainId: 789101
                    domain: mywebsite.org
                    price: null
                    requiresManualRenewal: true
                  - domainId: 999999
                    domain: null
                    price: null
                    error: Domain not found
        '400':
          description: "Invalid query parameters \u2014 e.g. `domainIds` is missing,\
            \ empty,\nor contains values that are not positive integers.\n"
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/renew:
    post:
      tags:
      - Domains
      summary: Submit domains for renewal
      description: "Submit a batch of domains for renewal. Auto-renewable domains\n\
        are grouped into a new renewal\norder whose ID is returned in `renewOrderId`.\
        \ Manual-provider\ndomains in the same batch are forwarded to the Mailpool\
        \ team for\nout-of-band processing \u2014 no order is created for them.\n\n\
        The request is atomic at the validation step: if any provided\n`domainId`\
        \ is invalid, no order is created and the response is a\n`400` with the per-item\
        \ `errors` array.\n"
      operationId: post-domains-renew
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domainIds:
                  type: array
                  description: 'IDs of the domains to renew. Must contain at least

                    one positive integer; duplicates are removed

                    server-side.

                    '
                  minItems: 1
                  items:
                    type: number
              required:
              - domainIds
            examples:
              Example 1:
                value:
                  domainIds:
                  - 123456
                  - 789101
      responses:
        '201':
          description: "Renewal request was accepted. When the batch contains at least\n\
            one domain registered with an auto-renew provider, the\nresponse includes\
            \ `renewOrderId` \u2014 use it with\n`GET /domains/renew/orders/{orderId}`\
            \ to poll the order status.\nWhen the batch contains only manual-provider\
            \ domains, the\nresponse is an empty object (`{}`); the Mailpool team\
            \ will\nprocess those renewals out of band.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  renewOrderId:
                    type: number
                    description: 'ID of the renewal order created for the

                      auto-renewable domains in the batch. Omitted when no

                      auto-renewable domains were included.

                      '
              examples:
                Auto-renewable batch:
                  value:
                    renewOrderId: 42
                Manual-only batch:
                  value: {}
        '400':
          description: "Renewal is atomic \u2014 no order is created when any provided\n\
            `domainId` fails validation. The response body contains an\n`errors` array\
            \ describing each invalid item (`domainId`,\nresolved `domain` name or\
            \ `null`, and a human-readable\n`error`).\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        domainId:
                          type: number
                          description: ID of the invalid domain.
                        domain:
                          type: string
                          description: 'Domain name when the ID was resolved in the

                            workspace, otherwise `null`.

                            '
                          nullable: true
                        error:
                          type: string
                          description: Human-readable reason for the rejection.
                      required:
                      - domainId
                      - error
                required:
                - errors
              examples:
                Example 1:
                  value:
                    errors:
                    - domainId: 999999
                      domain: null
                      error: Domain not found
                    - domainId: 123456
                      domain: example.com
                      error: Domain already has a renewal in progress
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /domains/renew/orders/{orderId}:
