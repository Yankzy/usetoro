      responses:
        '200':
          description: Stored credentials with secret values masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformCredentials'
        '400':
          description: Unknown or unsupported platform.
        '404':
          description: No credentials are stored for the given platform.
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /exports/mailboxes:
    post:
      tags:
      - Exports
      summary: Export mailboxes to a platform
      description: "Schedule a batch export of the given mailboxes to a third-party\
        \ platform\nusing the credentials previously saved via `POST /exports/credentials`.\n\
        \nThe call returns immediately with the newly created batch; use\n`GET /exports/batches/{batchId}`\
        \ to poll its progress. Mailboxes whose\ninbox type is not supported by the\
        \ target platform are skipped and\nreported back in the `errors` array of\
        \ the response \u2014 the batch is\nstill created for the remaining supported\
        \ mailboxes.\n"
      operationId: post-exports-mailboxes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportMailboxesRequest'
            examples:
              Example 1:
                value:
                  platform: instantly
                  mailboxIds:
                  - 789
                  - 790
                  - 791
      responses:
        '200':
          description: 'Export batch was scheduled. The response has the same shape
            as

            `GET /exports/batches/{batchId}` and additionally lists any

            requested mailboxes that were skipped because their inbox type

            is not supported by the target platform (see `errors`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportBatchCreatedResponse'
        '400':
          description: "Export failed to start \u2014 e.g. missing credentials for\
            \ the target\nplatform, an invalid platform, an empty `mailboxIds` list,\n\
            mailbox IDs that do not belong to the workspace, or none of the\nprovided\
            \ mailboxes having an inbox type that can be exported to\nthe target platform\
            \ (`Export these inboxes to this platform is\nnot supported.`).\n"
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /exports/mailboxes/csv:
    post:
      tags:
      - Exports
      summary: Export mailboxes as CSV
      description: 'Download a CSV file containing the given mailboxes formatted for
        the

        target platform. Unlike the automated export endpoint, this endpoint

        does not require stored credentials and accepts every value of

        `ExportPlatform` (including the generic `csv` format).

        '
      operationId: post-exports-mailboxes-csv
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportMailboxesCsvRequest'
            examples:
              Example 1:
                value:
                  platform: smartlead
                  mailboxIds:
                  - 789
                  - 790
      responses:
        '200':
          description: CSV file with mailbox data formatted for the target platform.
          content:
            text/csv:
              schema:
                type: string
                contentMediaType: application/octet-stream
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="mailboxes-export.csv"
              description: Attachment header suggesting the file name.
        '400':
          description: 'Invalid platform, an empty `mailboxIds` list, or none of the

            provided mailbox IDs belonging to the workspace

            (`Mailboxes not found`).

            '
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /exports/batches:
    get:
      tags:
      - Exports
      summary: Get export batches list
      description: 'Return a paginated list of export batches for the current workspace.

        Supports filtering by free-text search (e.g. mailbox email), by batch

        `status`, and by target `platform`.

        '
      operationId: get-exports-batches
      parameters:
      - name: limit
        in: query
        description: Maximum number of batches to return.
        required: true
        schema:
          type: number
      - name: offset
        in: query
        description: Offset for paginated response.
        required: true
        schema:
          type: number
      - name: search
        in: query
        description: Optional free-text search (e.g. mailbox email).
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter batches by their aggregated status.
        required: false
        schema:
          $ref: '#/components/schemas/ExportStatus'
      - name: platform
        in: query
        description: Filter batches by target platform.
        required: false
        schema:
          $ref: '#/components/schemas/ExportPlatform'
      responses:
        '200':
          description: Paginated list of export batches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExportBatch'
                  total:
                    type: number
                required:
                - data
                - total
              examples:
                Example 1:
                  value:
                    data:
                    - id: 42
                      createdAt: '2026-04-21T10:00:00Z'
                      status: in_progress
                      platform: instantly
                      exports:
                      - id: 101
                        mailboxId: 789
                        mailboxEmail: jane.doe@example.com
                        status: in_progress
                        domainType: google
                      - id: 102
                        mailboxId: 790
                        mailboxEmail: john.doe@example.com
                        status: completed
                        domainType: google
                    total: 1
        '400':
          description: Invalid `status` or `platform` filter value.
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /exports/batches/{batchId}:
    get:
      tags:
      - Exports
      summary: Get export batch
      description: 'Get a single export batch, including the status of each individual

        mailbox export inside it. Use this to poll the progress of a batch

        created via `POST /exports/mailboxes`.

        '
      operationId: get-exports-batches-batchId
      parameters:
      - name: batchId
        in: path
        description: Export batch ID.
        required: true
        schema:
          type: number
      responses:
        '200':
          description: The export batch, including per-mailbox status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportBatch'
        '404':
          description: Batch not found in the current workspace.
      security:
      - X-Api-Authorization: []
      servers:
      - url: https://app.mailpool.io/v1/api
        description: ''
  /subscriptions/slots:
    get:
      tags:
      - Subscriptions
      summary: Get subscriptions slots
      operationId: get-subscriptions-slots
      requestBody:
        content: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSlots'
      security:
      - X-Api-Authorization: []
