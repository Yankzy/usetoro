      description: "Current status of the mailbox.\n\n- `active` \u2014 the mailbox\
        \ is active and ready to be used.\n- `pending` \u2014 the mailbox is being\
        \ provisioned and is not ready yet.\n- `inactive` \u2014 the mailbox has been\
