info:
  title: Webhooks
  version: '1.0'
  summary: Webhooks for Mailpool
  description: |-
    Webhooks let you get notified when events happen in Mailpool.

    **Webhook Signature Verification**

    To ensure that incoming webhook requests are authentic and have not been tampered with, each webhook request includes a cryptographic signature. This signature allows you to verify that the payload was sent by a trusted source and was not modified in transit.

    **Signature Header**

    Each webhook request includes an `X-Signature` HTTP header:
    ```json
    X-Signature: 1502de1cb29f63372994ebe4ee0197dab53421ff21e7cfd0222a2d588eb098d2
    ```
    This value is a **HMAC-SHA256 hash** of the request payload, generated using a shared secret known only to the sender and receiver.

    **How Signature Verification Works**
    1. The webhook sender:
        - Serializes the webhook payload as JSON
        - Generates an HMAC using the SHA-256 algorithm and a shared secret
        - Sends the resulting hex-encoded hash in the X-Signature header

    2. The webhook receiver:
        - Recomputes the signature using the received payload and the same secret
        - Compares the computed signature with the value from the X-Signature header
        - Accepts the request only if the signatures match

    **Validating the Signature**
    Use the following method to validate an incoming webhook signature:
    ```json
    isValidSignature(receivedSignature: string, payload: any, secret: string): boolean {
      const expectedSignature = this.generateSignature(payload, secret);
      const bufferA = Buffer.from(receivedSignature, 'utf8');
      const bufferB = Buffer.from(expectedSignature, 'utf8');

      return (
        bufferA.length === bufferB.length &&
        crypto.timingSafeEqual(bufferA, bufferB)
      );
    }
    ```

    **Notes**
     - `crypto.timingSafeEqual` is used to prevent timing attacks.
     - The comparison only succeeds if both signatures are identical and of equal length.
     - If the signature is invalid, the webhook request should be rejected.

    **Generating the Expected Signature**
    The expected signature is generated by hashing the JSON payload with the shared secret using HMAC-SHA256:
    ```json
    generateSignature(payload: any, secret: string): string | null {
      if (!secret) {
        return null;
      }

      try {
        const payloadString = JSON.stringify(payload);
        const hmac = crypto.createHmac('sha256', secret);
        hmac.update(payloadString, 'utf8');
        return hmac.digest('hex');
      } catch (error) {
        this.logger.error(error, 'Failed to generate webhook signature');
        return null;
      }
    }
    ```

    **Important Considerations**
     - The payload must be stringified exactly as it was when the signature was created. Any differences in formatting or field order will result in a mismatched signature.
     - The secret must be kept private and stored securely.
     - If signature generation fails, the webhook request should be treated as untrusted.
