  # svix-ui:
  #   build:
  #     context: ../svixUI
  #     dockerfile: Dockerfile
  #   restart: always
  #   environment:
  #     SVIX_TOKEN: ${SVIX_EXAMPLE_TOKEN}
  #     SVIX_WEBHOOK_SECRET: ${SVIX_EXAMPLE_WEBHOOK_SECRET}
  #     SVIX_SERVER_URL: http://svix-server:8071
