x-nats-common: &nats-common
  image: nats:2.14.1-alpine3.22
  networks:
    - toro-net

services:
  db:
    image: yankz/usetoro-db:latest
    build:
      context: ../
      dockerfile: container/postgres/postgres.prod.Dockerfile
    restart: always
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=5", "-c", "max_wal_senders=5" ]
    environment:
      POSTGRES_DB: toro
      POSTGRES_USER: toro
      POSTGRES_PASSWORD: toro_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U toro" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toro-net

  gate:
    image: yankz/usetoro-gate:latest
    build:
      context: ../
      dockerfile: container/gate/gate.prod.Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_REDIRECT_URI: ${QBO_REDIRECT_URI}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION}
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"

    depends_on:
      db:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  # python-worker:
  #   image: yankz/usetoro-python-worker:latest
  #   build:
  #     context: ../
  #     dockerfile: python-worker/Dockerfile
  #   restart: always
  #   environment:
  #     # Use the cluster URL list so it knows all nodes
  #     NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
  #   depends_on:
  #     nats-1:
  #       condition: service_healthy
  #   networks:
  #     - toro-net

  protocol:
    image: yankz/usetoro-protocol:latest
    build:
      context: ../
      dockerfile: container/protocol/protocol.prod.Dockerfile
    restart: always
    ports:
      - "9090:9090"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,fignode,public"
      REDIS_URL: redis://redis:6379
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION:-false}
      CDC_ENABLED: ${CDC_ENABLED:-true}
      CDC_SYNC_INTERVAL: ${CDC_SYNC_INTERVAL:-1h}
    depends_on:
      db:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  sync:
    image: yankz/usetoro-sync:latest
    build:
      context: ../
      dockerfile: container/sync/Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
    depends_on:
      db:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  cdc-worker:
    image: yankz/usetoro-cdc-worker:latest
    build:
      context: ../
      dockerfile: container/cdc-worker/Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
    depends_on:
      db:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  ws:
    image: yankz/usetoro-ws:latest
    build:
      context: ../
      dockerfile: container/ws/ws.prod.Dockerfile
    restart: always
    ports:
      - "8081:8080"
    environment:
      WS_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_REDIRECT_URI: ${QBO_REDIRECT_URI:-http://localhost/api/auth/qbo/callback}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION:-false}
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  redis:
    image: redis:alpine
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - toro-net

  nats-1:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-1  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-2:${NATS_CLUSTER_PORT},nats://nats-3:${NATS_CLUSTER_PORT}  --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_1_data:/data
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8222/varz" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nats-2:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-2  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-1:${NATS_CLUSTER_PORT},nats://nats-3:${NATS_CLUSTER_PORT} 
    ports:
      - "4223:4222"
    volumes:
      - nats_2_data:/data

  nats-3:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-3  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-1:${NATS_CLUSTER_PORT},nats://nats-2:${NATS_CLUSTER_PORT} 
    ports:
      - "4224:4222"
    volumes:
      - nats_3_data:/data

  # svix-redis:
