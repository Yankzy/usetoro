  fignode:
    image: yankz/usetoro-fignode:latest
    build:
      context: ../
      dockerfile: container/fignode/fignode.prod.Dockerfile
    restart: always
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      AUTH_PRIVATE_KEY: ${AUTH_PRIVATE_KEY}
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY}
      PORT: 8083
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PGOPTIONS: "-c search_path=fignode,toro_core,shadow_erp,public"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  graphql:
    image: yankz/usetoro-graphql:latest
    build:
      context: ../
      dockerfile: container/graphql/graphql.prod.Dockerfile
    restart: always
    ports:
      - "8082:8080" # Exposed on host 8082 for debugging, but Nginx uses internal 8080
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      AUTH_PRIVATE_KEY: ${AUTH_PRIVATE_KEY}
      PORT: 8080
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  nginx:
    image: yankz/usetoro-nginx:latest
    build:
      context: ../
      dockerfile: container/nginx/nginx.prod.Dockerfile
    depends_on:
      - gate
      - graphql
    networks:
      - toro-net

  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from api.usetoro.io --to nginx:80
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    networks:
      - toro-net

  migrator:
    image: yankz/usetoro-migrator:latest
    build:
      context: ../
      dockerfile: container/migrator/migrator.prod.Dockerfile
    restart: on-failure
    command: >
      sh -c "sleep 2 && goose -dir /migrations postgres \"postgres://toro:toro_password@db/toro?sslmode=disable&options=-c%20search_path=toro_core,shadow_erp,fignode,public\" up"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - toro-net
