  #     - neo4j_data:/data
  #   networks:
  #     - toro-net

volumes:
  db_data:
  redis_data:
  nats_1_data:
  nats_2_data:
  nats_3_data:
  svix_redis_data:
  neo4j_data:
  caddy_data:
  caddy_config:

networks:
  toro-net:
    driver: bridge
