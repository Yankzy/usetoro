x-nats-common: &nats-common
  image: nats:2.14.1-alpine3.22
  networks:
    - toro-net

services:
  torodb:
    image: yankz/usetoro:torodb
    build:
      context: ../
      dockerfile: container/torodb/Dockerfile
    restart: always
    environment:
      POSTGRES_DB: toro
      POSTGRES_USER: toro
      POSTGRES_PASSWORD: toro_password
      PGDATA: /var/lib/postgresql/data/pgdata
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      DATABASE_URL: postgres://toro:toro_password@localhost:5432/toro?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U toro" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - toro-net

  gate:
    image: yankz/usetoro:gate
    build:
      context: ../
      dockerfile: container/gate/gate.prod.Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_REDIRECT_URI: ${QBO_REDIRECT_URI}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION}
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"

    depends_on:
      torodb:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  python-worker:
    image: yankz/usetoro:python-worker
    build:
      context: ../
      dockerfile: python-worker/Dockerfile
    restart: always
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,fignode,public"
    depends_on:
      torodb:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  protocol:
    image: yankz/usetoro:protocol
    build:
      context: ../
      dockerfile: container/protocol/protocol.prod.Dockerfile
    restart: always
    ports:
      - "9090:9090"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,fignode,public"
      REDIS_URL: redis://redis:6379
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION:-false}
      CDC_ENABLED: ${CDC_ENABLED:-true}
      CDC_SYNC_INTERVAL: ${CDC_SYNC_INTERVAL:-1h}
      POSTMARK_TRANSACTIONAL_SERVER_TOKEN: ${POSTMARK_TRANSACTIONAL_SERVER_TOKEN}
      POSTMARK_SENDER_SIGNATURE: ${POSTMARK_SENDER_SIGNATURE}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-${SLACK_BOT_AUTH_TOKEN}}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME}
    depends_on:
      torodb:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net
    volumes:
      - ../tap/workflows:/app/tap/workflows
      - ../go/internal/config/defaults.yml:/app/internal/config/defaults.yml
      - ../go/internal/erp/ase/dags:/app/internal/erp/ase/dags

  sync:
    image: yankz/usetoro:sync
    build:
      context: ../
      dockerfile: container/sync/Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
    depends_on:
      torodb:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  # cdc-worker:
  #   image: yankz/usetoro:cdc-worker
  #   build:
  #     context: ../
  #     dockerfile: container/cdc-worker/Dockerfile
  #   restart: always
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
  #     PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
  #   depends_on:
  #     torodb:
  #       condition: service_healthy
  #     nats-1:
  #       condition: service_healthy
  #   networks:
  #     - toro-net

  ws:
    image: yankz/usetoro:ws
    build:
      context: ../
      dockerfile: container/ws/ws.prod.Dockerfile
    restart: always
    ports:
      - "8081:8080"
    environment:
      WS_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_REDIRECT_URI: ${QBO_REDIRECT_URI:-http://localhost/api/auth/qbo/callback}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION:-false}
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      torodb:
        condition: service_healthy
      redis:
        condition: service_started
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  redis:
    image: redis:alpine
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - toro-net

  nats-1:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-1  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-2:${NATS_CLUSTER_PORT},nats://nats-3:${NATS_CLUSTER_PORT}  --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_1_data:/data
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8222/varz" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nats-2:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-2  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-1:${NATS_CLUSTER_PORT},nats://nats-3:${NATS_CLUSTER_PORT} 
    ports:
      - "4223:4222"
    volumes:
      - nats_2_data:/data

  nats-3:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-3  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-1:${NATS_CLUSTER_PORT},nats://nats-2:${NATS_CLUSTER_PORT} 
    ports:
      - "4224:4222"
    volumes:
      - nats_3_data:/data

  fignode:
    image: yankz/usetoro:fignode
    build:
      context: ../
      dockerfile: container/fignode/fignode.prod.Dockerfile
    restart: always
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      AUTH_PRIVATE_KEY: ${AUTH_PRIVATE_KEY}
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY}
      PORT: 8083
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PGOPTIONS: "-c search_path=fignode,toro_core,shadow_erp,public"
    depends_on:
      torodb:
        condition: service_healthy
      redis:
        condition: service_started
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  graphql:
    image: yankz/usetoro:graphql
    build:
      context: ../
      dockerfile: container/graphql/graphql.prod.Dockerfile
    restart: always
    ports:
      - "8082:8080" # Exposed on host 8082 for debugging, but Nginx uses internal 8080
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      AUTH_PRIVATE_KEY: ${AUTH_PRIVATE_KEY}
      PORT: 8080
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      torodb:
        condition: service_healthy
      redis:
        condition: service_started
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  nginx:
    image: yankz/usetoro:nginx
    build:
      context: ../
      dockerfile: container/nginx/nginx.prod.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gate
      - graphql
    networks:
      - toro-net

  # caddy:
  #   image: caddy:alpine
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   command: caddy reverse-proxy --from api.usetoro.io --to nginx:80
  #   volumes:
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - nginx
  #   networks:
  #     - toro-net

  migrator:
    image: yankz/usetoro:migrator
    build:
      context: ../
      dockerfile: container/migrator/migrator.prod.Dockerfile
    restart: on-failure
    command: >
      sh -c "sleep 2 && goose -dir /migrations postgres \"postgres://toro:toro_password@torodb/toro?sslmode=disable&options=-c%20search_path=toro_core,shadow_erp,fignode,public\" up"
    volumes:
      - ../sql/schema:/migrations
    depends_on:
      torodb:
        condition: service_healthy
    networks:
      - toro-net

volumes:
  db_data:
  redis_data:
  nats_1_data:
  nats_2_data:
  nats_3_data:
  caddy_data:
  caddy_config:

networks:
  toro-net:
    driver: bridge
