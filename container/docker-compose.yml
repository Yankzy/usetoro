  #     SVIX_QUEUE_TYPE: redis
  #     SVIX_DB_DSN: postgresql://toro:toro_password@db:5432/svix
  #     SVIX_REDIS_DSN: redis://svix-redis:6379
  #     SVIX_JWT_SECRET: ${SVIX_JWT_SECRET}
  #   ports:
  #     - "8071:8071"
  #   depends_on:
  #     - svix-redis
  #     - db
  #   networks:
  #     - toro-net

  # svix-ui:
  #   build:
  #     context: ../svixUI
  #     dockerfile: Dockerfile
  #   restart: always
  #   environment:
  #     SVIX_TOKEN: ${SVIX_EXAMPLE_TOKEN}
  #     SVIX_WEBHOOK_SECRET: ${SVIX_EXAMPLE_WEBHOOK_SECRET}
  #     SVIX_SERVER_URL: http://svix-server:8071
  #     NEXT_PUBLIC_SVIX_API_URL: http://localhost:8071/api/v1
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - svix-server
  #   networks:
  #     - toro-net

  fignode:
    build:
      context: ../
      dockerfile: container/fignode/Dockerfile
    restart: always
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NATS_URL: ${NATS_URL:-nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222}
      AUTH_PRIVATE_KEY: ${AUTH_PRIVATE_KEY}
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY}
      PORT: 8083
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PGOPTIONS: "-c search_path=fignode,toro_core,shadow_erp,public"
    volumes:
      - ../keys:/keys:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  graphql:
    build:
      context: ../
      dockerfile: container/graphql/Dockerfile
    restart: always
    ports:
      - "8082:8080" # Exposed on host 8082 for debugging, but Nginx uses internal 8080
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NATS_URL: ${NATS_URL:-nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222}
      AUTH_PRIVATE_KEY: ${AUTH_PRIVATE_KEY}
      PORT: 8080
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME}
    volumes:
      - ../keys:/keys # Mount keys directory
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  nginx:
    build:
      context: ../
      dockerfile: container/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gate
      - graphql
    networks:
      - toro-net

  migrator:
    image: gomicro/goose
    restart: on-failure
    command: >
      sh -c "sleep 2 && goose -dir /migrations postgres \"postgres://toro:toro_password@db/toro?sslmode=disable&options=-c%20search_path=toro_core,shadow_erp,fignode,public\" up"
    volumes:
      - ../sql/schema:/migrations
    depends_on:
      db:
        condition: service_healthy
    networks:
      - toro-net

  neo4j:
    image: neo4j:5
    restart: always
    environment:
      NEO4J_AUTH: neo4j/toro_password
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - toro-net

volumes:
  redis_data:
  nats_1_data:
  nats_2_data:
  nats_3_data:
  svix_redis_data:
  neo4j_data:

networks:
  toro-net:
    driver: bridge
