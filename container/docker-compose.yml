x-nats-common: &nats-common
  image: nats:2.14.1-alpine3.22
  networks:
    - toro-net

services:

  db:
    build:
      context: ../
      dockerfile: container/torodb/Dockerfile
    restart: always
    environment:
      POSTGRES_DB: toro
      POSTGRES_USER: toro
      POSTGRES_PASSWORD: toro_password
      PGDATA: /var/lib/postgresql/data/pgdata
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      DATABASE_URL: postgres://toro:toro_password@localhost:5432/toro?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./postgres/db_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U toro" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - toro-net

  gate:
    build:
      context: ../
      dockerfile: container/gate/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL:-nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_REDIRECT_URI: ${QBO_REDIRECT_URI}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION}
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME}

    volumes:
      - ../keys:/keys:ro
    depends_on:
      db:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  python-worker:
    build:
      context: ../
      dockerfile: python-worker/Dockerfile
    restart: always
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8005:8000"
    volumes:
      - ../python-worker:/app
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL:-nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,fignode,public"

    depends_on:
      db:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  protocol:
    build:
      context: ../
      dockerfile: container/protocol/Dockerfile
    restart: always
    ports:
      - "9090:9090"
      - "8084:8084"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL:-nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      MAILPOOL_API_KEY: ${MAILPOOL_API_KEY}
      MAILPOOL_ENDPOINT: ${MAILPOOL_ENDPOINT}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,fignode,public"
      LOG_LEVEL: "INFO"
      REDIS_URL: redis://redis:6379
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION:-false}
      CDC_ENABLED: ${CDC_ENABLED:-true}
      CDC_SYNC_INTERVAL: ${CDC_SYNC_INTERVAL:-1h}
      POSTMARK_TRANSACTIONAL_SERVER_TOKEN: ${POSTMARK_TRANSACTIONAL_SERVER_TOKEN}
      POSTMARK_SENDER_SIGNATURE: ${POSTMARK_SENDER_SIGNATURE}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-${SLACK_BOT_AUTH_TOKEN}}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME}
    depends_on:
      db:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net
    volumes:
      - ../tap/workflows:/app/tap/workflows
      - ../go/internal/config/defaults.yml:/app/internal/config/defaults.yml
      - ../go/internal/erp/ase/dags:/app/internal/erp/ase/dags

  sync:
    build:
      context: ../
      dockerfile: container/sync/Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL:-nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      MAILPOOL_API_KEY: ${MAILPOOL_API_KEY}
      MAILPOOL_ENDPOINT: ${MAILPOOL_ENDPOINT}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
    depends_on:
      db:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  cdc-worker:
    build:
      context: ../
      dockerfile: container/cdc-worker/Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL:-nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
    depends_on:
      db:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  ws:
    build:
      context: ../
      dockerfile: container/ws/Dockerfile
    restart: always
    ports:
      - "8081:8080"
    environment:
      WS_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET}
      QBO_REDIRECT_URI: ${QBO_REDIRECT_URI:-http://localhost/api/auth/qbo/callback}
      QBO_IS_PRODUCTION: ${QBO_IS_PRODUCTION:-false}
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NATS_URL: ${NATS_URL:-nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222}
      PGOPTIONS: "-c search_path=toro_core,shadow_erp,public"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MAILPOOL_API_KEY: ${MAILPOOL_API_KEY}
      MAILPOOL_ENDPOINT: ${MAILPOOL_ENDPOINT}
    volumes:
      - ../keys:/keys:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  redis:
    image: redis:alpine
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - toro-net

  nats-1:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-1  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-2:${NATS_CLUSTER_PORT},nats://nats-3:${NATS_CLUSTER_PORT}  --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_1_data:/data
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8222/varz" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nats-2:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-2  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-1:${NATS_CLUSTER_PORT},nats://nats-3:${NATS_CLUSTER_PORT} 
    ports:
      - "4223:4222"
    volumes:
      - nats_2_data:/data

  nats-3:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-3  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-1:${NATS_CLUSTER_PORT},nats://nats-2:${NATS_CLUSTER_PORT} 
    ports:
      - "4224:4222"
    volumes:
      - nats_3_data:/data

  # svix-redis:
