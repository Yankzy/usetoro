x-nats-common: &nats-common
  image: nats:2.9-alpine
  networks:
    - toro-net

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: toro
      POSTGRES_USER: toro
      POSTGRES_PASSWORD: toro_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U toro" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toro-net

  gate:
    build:
      context: ../
      dockerfile: container/gate/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
    depends_on:
      db:
        condition: service_healthy
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  python-worker:
    build:
      context: ../
      dockerfile: python-worker/Dockerfile
    restart: always
    environment:
      # Use the cluster URL list so it knows all nodes
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
    depends_on:
      nats-1:
        condition: service_healthy
    networks:
      - toro-net

  # protocol:
  #   build:
  #     context: ../
  #     dockerfile: container/protocol/Dockerfile
  #   restart: always
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
  #     # OPENAI_API_KEY: ${OPENAI_API_KEY} # Make sure this is in .env
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     nats-1:
  #       condition: service_healthy
  #   networks:
  #     - toro-net

  # sync:
  #   build:
  #     context: ../
  #     dockerfile: container/sync/Dockerfile
  #   restart: always
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     nats-1:
  #       condition: service_healthy
  #   networks:
  #     - toro-net

  redis:
    image: redis:alpine
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - toro-net

  nats-1:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-1  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-2:${NATS_CLUSTER_PORT},nats://nats-3:${NATS_CLUSTER_PORT}  --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_1_data:/data
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8222/varz" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nats-2:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-2  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-1:${NATS_CLUSTER_PORT},nats://nats-3:${NATS_CLUSTER_PORT} 
    ports:
      - "4223:4222"
    volumes:
      - nats_2_data:/data

  nats-3:
    <<: *nats-common
    command: >
      -js  -sd /data  --cluster_name=${NATS_CLUSTER_NAME}  --name=nats-3  --cluster=nats://0.0.0.0:${NATS_CLUSTER_PORT}  --routes=nats://nats-1:${NATS_CLUSTER_PORT},nats://nats-2:${NATS_CLUSTER_PORT} 
    ports:
      - "4224:4222"
    volumes:
      - nats_3_data:/data

  svix-redis:
    image: redis:alpine
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - svix_redis_data:/data
    networks:
      - toro-net

  svix-server:
    image: svix/svix-server:v1.84.1
    restart: always
    environment:
      SVIX_QUEUE_TYPE: redis
      SVIX_DB_DSN: postgresql://toro:toro_password@db:5432/svix
      SVIX_REDIS_DSN: redis://svix-redis:6379
      SVIX_JWT_SECRET: ${SVIX_JWT_SECRET}
    ports:
      - "8071:8071"
    depends_on:
      - svix-redis
      - db
    networks:
      - toro-net

  svix-ui:
    build:
      context: ../svixUI
      dockerfile: Dockerfile
    restart: always
    environment:
      SVIX_TOKEN: ${SVIX_EXAMPLE_TOKEN}
      SVIX_WEBHOOK_SECRET: ${SVIX_EXAMPLE_WEBHOOK_SECRET}
      SVIX_SERVER_URL: http://svix-server:8071
      NEXT_PUBLIC_SVIX_API_URL: http://localhost:8071/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - svix-server
    networks:
      - toro-net

  nginx:
    build:
      context: ../
      dockerfile: container/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gate
      - svix-server
    networks:
      - toro-net

  migrator:
    image: gomicro/goose
    command: "goose -dir /migrations postgres \"user=toro password=toro_password dbname=toro host=db sslmode=disable\" up"
    volumes:
      - ../sql/schema:/migrations
    depends_on:
      db:
        condition: service_healthy
    networks:
      - toro-net

volumes:
  postgres_data:
  redis_data:
  nats_1_data:
  nats_2_data:
  nats_3_data:
  svix_redis_data:


networks:
  toro-net:
    driver: bridge
