[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor

[program:gunicorn]
command=gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers %(ENV_GUNICORN_WORKERS)s --threads %(ENV_GUNICORN_THREADS)s --timeout %(ENV_GUNICORN_TIMEOUT)s --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile -
directory=/app/ledger
environment=PYTHONPATH="/app:/app/ledger",DJANGO_SETTINGS_MODULE="config.settings"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=30

[program:accounting_intake_worker]
command=python /app/ledger/manage.py run_accounting_intake_worker
directory=/app/ledger
environment=PYTHONPATH="/app:/app/ledger",DJANGO_SETTINGS_MODULE="config.settings"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=30

[program:bookkeeping_session_worker]
command=python /app/ledger/manage.py run_bookkeeping_session_worker
directory=/app/ledger
environment=PYTHONPATH="/app:/app/ledger",DJANGO_SETTINGS_MODULE="config.settings"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=30

