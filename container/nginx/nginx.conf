upstream backend_go {
    # FIX: Must match docker-compose service name 'go-app'
    server gate:8080;
    keepalive 32; # Keep connections open for speed
}

upstream backend_svix {
    server svix-server:8071;
}

upstream backend_svix_ui {
    server svix-ui:3000;
}

upstream backend_ws {
    server ws:8080;
}

server {
    listen 80;
    server_name localhost usetoro.io www.usetoro.io;

    # Default strict limit (Protection against Payload Bombs)
    client_max_body_size 1M;

    root /usr/share/nginx/html;
    index index.html;

    # --- 1. Frontend (React SPA) ---
    location / {
        try_files $uri $uri/ /index.html;
        # Allow larger uploads ONLY for frontend (e.g. PDF Receipts)
        client_max_body_size 20M; 
    }

    # --- 2. Go API & Webhooks ---
    location /api/ {
        proxy_pass http://backend_go/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 3. High-Performance WebSocket (For Voice Agents) ---
    # Matches /api/voice/stream
    location /api/voice/ {
        proxy_pass http://backend_go/voice/;
        proxy_http_version 1.1;
        
        # CRITICAL: These headers allow the WebSocket Handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_read_timeout 3600s; # Don't timeout voice calls
        proxy_send_timeout 3600s;
    }

    # --- 4. WebSocket for QBO Authentication (Desktop App) ---
    location /ws {
        proxy_pass http://backend_ws;
        proxy_http_version 1.1;
        
        # CRITICAL: These headers allow the WebSocket Handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s; # Keep connection alive
        proxy_send_timeout 3600s;
    }

    # --- 5. Svix Internal Dashboard (Protected) ---
    # Proxies /svix-dashboard/ -> Svix Server
    location /svix-ui/ {
        proxy_pass http://backend_svix/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Optional: Add Basic Auth here if exposing to public internet
        # auth_basic "Restricted Content";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # --- 6. Svix Example UI ---
    location /example/ {
        proxy_pass http://backend_svix_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
