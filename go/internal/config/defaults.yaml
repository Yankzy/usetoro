x-jetstream-default: &jetstream-default
  replicas: 3
  max_age: 72h
  deny_delete: true
  deny_purge: true
  allow_rollup: false
  allow_direct: true

# CDC (Change Data Capture) Configuration
cdc_enabled: true
cdc_sync_interval: 1h

rule_engine:
  # target_rank defines which consensus result to pick (1 = most frequent)
  target_rank: 1
  # min_usage_count is the minimum number of historical matches required to auto-generate a rule
  min_usage_count: 1

nats:
  streams:
    sync:
      stream_name: SYNC
      subject_template: cmd.sync.{{.CPAID}}.{{.RealmID}}.{{.Resource}}.{{.Action}}
      jetstream:
        <<: *jetstream-default
        subjects: 
          - cmd.sync.>
      
      # Components inside sync service
      components:
        qbo:
          stream_name: QBO_EVENTS
          jetstream:
            <<: *jetstream-default
            subjects: 
              - qbo.>
            
    gate:
      stream_name: GATE
      jetstream:
        <<: *jetstream-default
        subjects:
          - stripe.>
          - plaid.>
          - internal.>



    erp:
      stream_name: TORO_ERP_EVENTS
      jetstream:
        <<: *jetstream-default
        subjects:
          - toro.erp.events.*

    settlement:
      stream_name: SETTLEMENT
      jetstream:
        <<: *jetstream-default
        subjects:
          - contracts.request
          - raw.ingest.samsara

    almanac:
      stream_name: ALMANAC
      jetstream:
        <<: *jetstream-default
        subjects:
          - almanac.register
          - almanac.query
          - almanac.register.dlq

    ledger:
      stream_name: LEDGER
      jetstream:
        <<: *jetstream-default
        subjects:
          - ledger.>

    tasks:
      stream_name: TASKS
      jetstream:
        <<: *jetstream-default
        max_age: 168h # 7 days
        subjects:
          - tasks.>
          - proof.>

    redux:
      stream_name: REDUX_TEST
      jetstream:
        <<: *jetstream-default
        subjects:
          - redux.>

    workflows:
      stream_name: WORKFLOWS
      jetstream:
        <<: *jetstream-default
        subjects:
          - orchestrator.inbox
          - agents.>
          - worker.inbox.>
          - workflow.events.>
          - workflow.query.>
          - workflow.dlq.trigger
          - workflow.dlq.inbox
          - workflow.resume

    workflow_triggers:
      stream_name: WORKFLOW_TRIGGERS
      jetstream:
        <<: *jetstream-default
        # Bootstrap wide so producers can publish even before the Orchestrator has synced subjects.
        # The Orchestrator will reconcile this to the exact set of trigger topics stored in Postgres.
        subjects:
          - events.>
agents:
