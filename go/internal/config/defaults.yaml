x-jetstream-default: &jetstream-default
  replicas: 3
  max_age: 72h
  deny_delete: true
  deny_purge: true
  allow_rollup: false
  allow_direct: true

# CDC (Change Data Capture) Configuration
cdc_enabled: true
cdc_sync_interval: 1h

nats:
  streams:
    sync:
      stream_name: SYNC
      subject_template: cmd.sync.{{.CPAID}}.{{.RealmID}}.{{.Resource}}.{{.Action}}
      jetstream:
        <<: *jetstream-default
        subjects: 
          - cmd.sync.>
      
      # Components inside sync service
      components:
        qbo:
          stream_name: QBO_EVENTS
          jetstream:
            <<: *jetstream-default
            subjects: 
              - qbo.>
            
    gate:
      stream_name: GATE
      jetstream:
        <<: *jetstream-default
        subjects:
          - stripe.>
          - plaid.>
          - internal.>

    ws:
      stream_name: QBO_EVENTS # Consumes from QBO stream (defined in components)
      jetstream:
        <<: *jetstream-default
        subjects:
          - qbo.events.connected

    erp:
      stream_name: TORO_ERP_EVENTS
      jetstream:
        <<: *jetstream-default
        subjects:
          - toro.erp.events.*

    settlement:
      stream_name: SETTLEMENT
      jetstream:
        <<: *jetstream-default
        subjects:
          - contracts.request
          - raw.ingest.samsara

    almanac:
      stream_name: ALMANAC
      jetstream:
        <<: *jetstream-default
        subjects:
          - almanac.register
          - almanac.query

    ledger:
      stream_name: LEDGER
      jetstream:
        <<: *jetstream-default
        subjects:
          - ledger.>

    tasks:
      stream_name: TASKS
      jetstream:
        <<: *jetstream-default
        max_age: 168h # 7 days
        subjects:
          - tasks.>
          - proof.>

    redux:
      stream_name: REDUX_TEST
      jetstream:
        <<: *jetstream-default
        subjects:
          - redux.>
agents:
  - did: "did:toro:agent:cleanup_1"
    name: "Accounting Cleanup Agent"
    model: "gpt-4o-mini"
    engine: "internal"
    internal_module: "cleanup-agent"
    dependencies:
      database: false
      db_queries: true
      entity_resolver: false

  - did: "did:toro:agent:reconcile_expense_1"
    name: "Expense Reconciliation Agent"
    model: "gpt-4o-mini"
    engine: "internal"
    internal_module: "reconcile-expense-agent"
    dependencies:
      database: false
