x-jetstream-default: &jetstream-default
  replicas: 3
  max_age: 72h
  deny_delete: true
  deny_purge: true
  allow_rollup: false
  allow_direct: true

# CDC (Change Data Capture) Configuration
cdc_enabled: true
cdc_sync_interval: 1h

nats:
  streams:
    sync:
      stream_name: SYNC
      subject_template: cmd.sync.{{.CPAID}}.{{.RealmID}}.{{.Resource}}.{{.Action}}
      jetstream:
        <<: *jetstream-default
        subjects: 
          - cmd.sync.>
      
      # Components inside sync service
      components:
        qbo:
          stream_name: QBO_EVENTS
          jetstream:
            <<: *jetstream-default
            subjects: 
              - qbo.>
            
    gate:
      stream_name: GATE
      jetstream:
        <<: *jetstream-default
        subjects:
          - stripe.>
          - plaid.>
          - internal.>



    erp:
      stream_name: TORO_ERP_EVENTS
      jetstream:
        <<: *jetstream-default
        subjects:
          - toro.erp.events.*

    settlement:
      stream_name: SETTLEMENT
      jetstream:
        <<: *jetstream-default
        subjects:
          - contracts.request
          - raw.ingest.samsara

    almanac:
      stream_name: ALMANAC
      jetstream:
        <<: *jetstream-default
        subjects:
          - almanac.register
          - almanac.query

    ledger:
      stream_name: LEDGER
      jetstream:
        <<: *jetstream-default
        subjects:
          - ledger.>

    tasks:
      stream_name: TASKS
      jetstream:
        <<: *jetstream-default
        max_age: 168h # 7 days
        subjects:
          - tasks.>
          - proof.>

    redux:
      stream_name: REDUX_TEST
      jetstream:
        <<: *jetstream-default
        subjects:
          - redux.>

    workflows:
      stream_name: WORKFLOWS
      jetstream:
        <<: *jetstream-default
        subjects:
          - orchestrator.inbox
          - agents.>
          - worker.inbox.>
          - workflow.events.>
          - workflow.query.>

    workflow_triggers:
      stream_name: WORKFLOW_TRIGGERS
      jetstream:
        <<: *jetstream-default
        # Bootstrap wide so producers can publish even before the Orchestrator has synced subjects.
        # The Orchestrator will reconcile this to the exact set of trigger topics stored in Postgres.
        subjects:
          - events.>
agents:
  - did: "did:toro:agent:csv_mapping_1"
    name: "CSV Mapping Agent"
    model: "gpt-5.4-mini"
    engine: "internal"
    internal_module: "csv-mapping-agent"
    activity_type: "agents.accounting.map_csv"
    system_prompt: |
      You are an expert data analyst parsing raw bank statement CSV headers. Analyze the columns and map them to standard accounting fields. You MUST reply with valid JSON.
      The JSON must strictly conform to this schema and ONLY contain these fields:
      {
        "date_col_idx": <int>,
        "description_col_idx": <int>,
        "amount_col_idx": <int>,
        "is_split_amount": <false unless there are clearly SEPARATE debit and credit columns>,
        "debit_col_idx": <null if not split>,
        "credit_col_idx": <null if not split>,
        "vendor_col_idx": <null if no explicit vendor column>,
        "customer_col_idx": <null if no customer column>,
        "is_expense_positive": <bool>,
        "confidence_score": <float 0 to 1>
      }
      Crucially, ensure description_col_idx corresponds to the memo/description column, not the date column! Use proper null types in JSON, never use 0 to represent absence!
    dependencies:
      database: false
      db_queries: true
      entity_resolver: false

  - did: "did:toro:agent:reconcile_expense_1"
    name: "Expense Reconciliation Agent"
    model: "gpt-5.4-mini"
    engine: "internal"
    internal_module: "reconcile-expense-agent"
    activity_type: "agents.accounting.reconcile_expense"
    output_subject: "proof.accounting.cleanup.reconcile.expense"
    dependencies:
      database: false
      db_queries: true
      entity_resolver: true

  - did: "did:toro:agent:reconcile_revenue_1"
    name: "Revenue Reconciliation Agent"
    model: "gpt-5.4-mini"
    engine: "internal"
    internal_module: "reconcile-revenue-agent"
    activity_type: "agents.accounting.reconcile_revenue"
    output_subject: "proof.accounting.cleanup.reconcile.revenue"
    dependencies:
      database: false
      db_queries: true
      entity_resolver: true

  - did: "did:toro:agent:approval_1"
    name: "Transaction Approval Agent"
    model: "gpt-5.4-mini"
    engine: "internal"
    internal_module: "approval-agent"
    activity_type: "agents.accounting.approval"
    dependencies:
      database: false
      db_queries: false
      entity_resolver: false

  - did: "did:toro:agent:stripe_processor_1"
    name: "Stripe Receipt Processor"
    model: "gpt-5.4-mini"
    engine: "internal"
    internal_module: "stripe-processor-agent"
    activity_type: "agents.payments.stripe_receipt_processor"
    dependencies:
      database: false
      db_queries: true
      entity_resolver: false

  - did: "did:toro:agent:intent_extractor"
    name: "Intent Extractor Agent"
    model: "gpt-5.4-mini"
    engine: "internal"
    internal_module: "intent-extractor-agent"
    activity_type: "agents.intent.classify"
    output_subject: "proof.intent.classify"
    system_prompt: |
      You are the Intent Extractor Agent. Analyze incoming SMS, MMS, or text and classify the intent using ONLY the labels defined in the schema below. Extract numerical entities where applicable. Respond ONLY in valid JSON matching the exact schema provided — no markdown, no explanation, no extra fields.
    dependencies:
      database: false
      db_queries: false
      entity_resolver: false

  - did: "did:toro:agent:ocr_agent"
    name: "OCR_Agent"
    model: "gpt-5.4-mini"
    engine: "internal"
    internal_module: "ocr_agent"
    activity_type: "agents.ocr"
    system_prompt: |
      You are an OCR agent that analyzes incoming MMS images, receipts, and other documents, and extracts structured context from them.
    dependencies:
      database: false
      db_queries: true
      entity_resolver: false

workers:
  csv_mapping:
    activity_type: "workers.database.insert_rows"
    # Leave subject empty to derive from activity type; override here if needed.
    subject: ""
    group: ""
  enrichment:
    activity_type: "workers.database.enrich_rows"
    subject: ""
    group: ""
  erp_event:
    subject: "toro.erp.events.*"
    group: ""
  transaction:
    subject: "ledger.shadow_erp_proposed_transactions.*"
    group: ""
  fignode_publisher:
    subject: "proof.accounting.cleanup.reconcile.>"
    group: ""
  attachable:
    subject: "ledger.shadow_erp_attachables.insert"
    group: ""
  webhooks:
    activity_type: "workers.webhooks.execute"
    subject: ""
    group: ""
  vector_sync:
    subjects:
      - "ledger.accounts.*"
      - "ledger.vendors.*"
      - "ledger.customers.*"
    group_prefix: "toro-pinecone-v2"
