x-jetstream-default: &jetstream-default
  replicas: 3
  max_age: 72h
  deny_delete: true
  deny_purge: true
  allow_rollup: false
  allow_direct: true

# Communication Channel Config
postmark_server_token: ""
postmark_sender_signature: ""
vcoo_founder_email: "yankz@fignode.com"
twilio_account_sid: ""
twilio_auth_token: ""
twilio_sms_number: ""
twilio_wa_number: ""
telegram_bot_token: ""
slack_bot_token: ""
slack_signing_secret: ""
slack_client_id: ""
slack_client_secret: ""

# CDC (Change Data Capture) Configuration
cdc_enabled: true
cdc_sync_interval: 1h

rule_engine:
  # target_rank defines which consensus result to pick (1 = most frequent)
  target_rank: 1
  # min_usage_count is the minimum number of historical matches required to auto-generate a rule
  min_usage_count: 1

nats:
  streams:
    sync:
      stream_name: SYNC
      subject_template: cmd.sync.{{.CPAID}}.{{.RealmID}}.{{.Resource}}.{{.Action}}
      jetstream:
        <<: *jetstream-default
        subjects: 
          - cmd.sync.>
      
      # Components inside sync service
      components:
        qbo:
          stream_name: QBO_EVENTS
          jetstream:
            <<: *jetstream-default
            subjects: 
              - qbo.>
            
    gate:
      stream_name: GATE
      jetstream:
        <<: *jetstream-default
        subjects:
          - stripe.>
          - plaid.>
          - internal.>



    erp:
      stream_name: TORO_ERP_EVENTS
      jetstream:
        <<: *jetstream-default
        subjects:
          - toro.erp.events.*

    settlement:
      stream_name: SETTLEMENT
      jetstream:
        <<: *jetstream-default
        subjects:
          - contracts.request
          - raw.ingest.samsara

    almanac:
      stream_name: ALMANAC
      jetstream:
        <<: *jetstream-default
        subjects:
          - almanac.register
          - almanac.query
          - almanac.register.dlq

    ledger:
      stream_name: LEDGER
      jetstream:
        <<: *jetstream-default
        subjects:
          - ledger.>

    tasks:
      stream_name: TASKS
      jetstream:
        <<: *jetstream-default
        max_age: 168h # 7 days
        subjects:
          - tasks.>
          - proof.>

    redux:
      stream_name: REDUX_TEST
      jetstream:
        <<: *jetstream-default
        subjects:
          - redux.>

    workflows:
      stream_name: WORKFLOWS
      jetstream:
        <<: *jetstream-default
        allow_msg_ttl: true
        subjects:
          - orchestrator.inbox
          - agents.>
          - worker.inbox.>
          - workflow.events.>
          - workflow.query.>
          - workflow.dlq.trigger
          - workflow.dlq.inbox
          - workflow.resume
          - ase.telemetry.>
          - ase.events.>

    workflow_triggers:
      stream_name: WORKFLOW_TRIGGERS
      jetstream:
        <<: *jetstream-default
        # Bootstrap wide so producers can publish even before the Orchestrator has synced subjects.
        # The Orchestrator will reconcile this to the exact set of trigger topics stored in Postgres.
        subjects:
          - events.>
agents:
  - did: did:toro:agent:csv_mapping_1
    name: CSV Mapping Agent
    model: gpt-5.4-mini
    engine: internal
    internal_module: csv-mapping-agent
    activity_type: agents.accounting.map_csv
    task_queue: tasks.accounting.1.map_csv
    dependencies:
      database: false
      db_queries: true
      entity_resolver: false

  - did: did:toro:agent:reconcile_expense_1
    name: Expense Reconciliation Agent
    model: gpt-5.4-mini
    engine: internal
    internal_module: reconcile-expense-agent
    activity_type: agents.accounting.reconcile_expense
    task_queue: tasks.accounting.1.reconcile_expense
    output_subject: proof.accounting.cleanup.reconcile.expense
    dependencies:
      database: false
      db_queries: true
      entity_resolver: true

  - did: did:toro:agent:reconcile_revenue_1
    name: Revenue Reconciliation Agent
    model: gpt-5.4-mini
    engine: internal
    internal_module: reconcile-revenue-agent
    activity_type: agents.accounting.reconcile_revenue
    task_queue: tasks.accounting.1.reconcile_revenue
    output_subject: proof.accounting.cleanup.reconcile.revenue
    dependencies:
      database: false
      db_queries: true
      entity_resolver: true

  - did: did:toro:agent:approval_1
    name: Transaction Approval Agent
    model: gpt-5.4-mini
    engine: internal
    internal_module: approval-agent
    activity_type: agents.accounting.approval
    task_queue: tasks.accounting.1.approval
    dependencies:
      database: false
      db_queries: false
      entity_resolver: false

  - did: did:toro:agent:stripe_processor_1
    name: Stripe Receipt Processor
    model: gpt-5.4-mini
    engine: internal
    internal_module: stripe-processor-agent
    activity_type: agents.payments.stripe_receipt_processor
    task_queue: tasks.payments.1.stripe_receipt_processor
    dependencies:
      database: false
      db_queries: true
      entity_resolver: false

  - did: did:toro:agent:intent_extractor
    name: Intent Extractor Agent
    model: gpt-5.4-mini
    engine: internal
    internal_module: intent-extractor-agent
    activity_type: agents.intent.classify
    output_subject: "proof.intent.classify"
    task_queue: tasks.intent.1.classify
    dependencies:
      database: false
      db_queries: false
      entity_resolver: false

  - did: did:toro:agent:ocr_agent
    name: OCR_Agent
    model: gpt-5.4-mini
    engine: internal
    internal_module: ocr_agent
    activity_type: agents.perception.ocr
    task_queue: tasks.perception.1.ocr
    dependencies:
      database: false
      db_queries: true
      entity_resolver: false

  - did: did:toro:agent:batch_categorization
    name: Batch Categorization Agent
    model: gpt-5.4-mini
    engine: internal
    internal_module: generic-batch-agent
    activity_type: agents.accounting.batch_categorization
    task_queue: tasks.accounting.1.batch_categorization
    dependencies:
      database: false
      db_queries: true
      entity_resolver: false
  - did: did:toro:agent:general_purpose_1
    name: General Purpose Agent
    model: gpt-5.4
    engine: internal
    internal_module: general-agent
    activity_type: agents.general.purpose
    task_queue: tasks.general.1.purpose
    system_prompt: |
      You are a general-purpose AI agent. You have access to tools for running shell commands, reading and editing files, searching code, fetching web content, and spawning sub-agents.
      Before delegating specialized tasks, use the AlmanacLookup tool to discover available agents.
      Use the Delegate tool to create dynamic workflows for specialized agents.
      Use the CallWorker tool to synchronously execute background workers for deterministic tasks.
      
      When alerted by the system (e.g. from 'ase-engine') that a transaction is stuck in HOLD_MISSING_CONTEXT, it is your responsibility to contact the business owner to ask for the missing information.
      You must independently decide how to contact them. Use the LookupClient tool to find their contact details, and use the SendEmail tool as your default method of communication to request the missing context.

      IMPORTANT context on ID mapping: To preserve privacy and prevent hallucinations, all database UUIDs and QuickBooks Realm IDs in the conversation history are obfuscated to short references like 'ref_1', 'ref_2', etc. Note that a 'ref_X' reference is NOT just any random number, but is actually a locally mapped UUID or QuickBooks Realm ID. When you interact with tools or respond to the user, you must pass and return these 'ref_X' references exactly as you received them because they are mapped locally on the backend.
    tools:
      - name: "ConversationState"
      - name: "ScheduleReminder"
      - name: "AlmanacLookup"
      - name: "Delegate"
      - name: "LookupClient"
      - name: "SendEmail"
      - name: "FetchCommunicationHistory"
      - name: "UpdateTransactionClassification"
      - name: "Bash"
      - name: "FileRead"
      - name: "FileWrite"
      - name: "FileEdit"
      - name: "Grep"
      - name: "WebFetch"
    dependencies:
      database: false
      db_queries: true
      entity_resolver: false



