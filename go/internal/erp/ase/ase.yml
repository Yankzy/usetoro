  # --- ASSET PROMPTS ---
  bank_gate_specialist: |
    Analyze the bank transaction. Determine if it represents an internal liquidity movement between company bank profiles, a cash sweep into treasury, or standard cash operational deployment.
    Select from: "INTERNAL_TRANSFER", "TREASURY_CASH_SWEEP", "STANDARD_LIQUIDITY_FLOW".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "bank_gate_decision",
      "candidates": [
        { "value": "INTERNAL_TRANSFER", "confidence": 1.00, "reasoning": "Inter-account sweep ledger footprint identified." }
      ]
    }

  fixed_assets_gate_specialist: |
    Examine the physical property, vehicle, software infrastructure, or equipment purchase under capitalization limits.
    Rule: Capitalize if the transaction amount is strictly greater than $2,500. Otherwise, treat as immediate de-minimis runtime expense.
    Select from: "CAPITALIZE_ASSET", "DE_MINIMIS_EXPENSE_TRIGGER".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "fixed_assets_gate_decision",
      "candidates": [
        { "value": "CAPITALIZE_ASSET", "confidence": 1.00, "reasoning": "Transaction total exceeds the static $2,500 threshold criteria." }
      ]
    }

  leasehold_improvements_gate_specialist: |
    Examine cash paid out for structural modifications to rented or leased physical commercial footprints.
    Select from: "CAPITALIZE_IMPROVEMENT", "REPAIRS_MAINTENANCE_EXPENSE".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "leasehold_improvements_gate_decision",
      "candidates": [
        { "value": "CAPITALIZE_IMPROVEMENT", "confidence": 0.90, "reasoning": "Permit details indicate permanent structural alterations to layout." },
        { "value": "REPAIRS_MAINTENANCE_EXPENSE", "confidence": 0.10, "reasoning": "Minor allocation ambiguity over wear-and-tear items." }
      ]
    }

  other_current_assets_gate_specialist: |
    Triage short-term economic values. Differentiate between cash paid upfront for inventory production deposits versus refundable lease/utility security deposits.
    Select from: "INVENTORY_PREPAYMENT", "SECURITY_DEPOSIT", "STANDARD_CURRENT_ASSET".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "other_current_assets_gate_decision",
      "candidates": [
        { "value": "SECURITY_DEPOSIT", "confidence": 1.00, "reasoning": "Direct contractual matching for commercial space utility initiation." }
      ]
    }

  other_assets_gate_specialist: |
    Triage long-term economic values and intangible assets. Differentiate between capitalized intellectual property (patents, trademarks) and long-term security deposits.
    Select from: "INTANGIBLE_ASSET", "LONG_TERM_SECURITY_DEPOSIT", "STANDARD_OTHER_ASSET".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "other_assets_gate_decision",
      "candidates": [
        { "value": "INTANGIBLE_ASSET", "confidence": 1.00, "reasoning": "Payment identified for trademark registration." }
      ]
    }

  # --- EQUITY PROMPTS ---
  equity_flow_specialist: |
    Analyze capital interactions involving company owners, partners, or equity officers.
    Select from: "OWNER_INVESTMENT", "OWNER_DRAW", "SHAREHOLDER_DISTRIBUTION".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "equity_flow_decision",
      "candidates": [
        { "value": "OWNER_DRAW", "confidence": 1.00, "reasoning": "Personal transfer markers matched with zero operational invoice markers." }
      ]
    }

  # --- REVENUE PROMPTS ---
  operating_income_specialist: |
    Examine cash inflows from primary business channels. Isolate gross merchant processor deposits that bundle transaction fees from raw customer invoices.
    Select from: "GROMENT_STRIPE_SQUARE_SPLIT", "STANDARD_CASH_RECEIPT".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "operating_income_decision",
      "candidates": [
        { "value": "GROMENT_STRIPE_SQUARE_SPLIT", "confidence": 1.00, "reasoning": "Stripe batch distribution format detected." }
      ]
    }

  other_income_gate_specialist: |
    Analyze miscellaneous cash inflows. Differentiate between non-operating income (like interest or dividends) and other standard revenue.
    Select from: "INTEREST_DIVIDEND_INCOME", "STANDARD_OTHER_INCOME".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "other_income_gate_decision",
      "candidates": [
        { "value": "INTEREST_DIVIDEND_INCOME", "confidence": 1.00, "reasoning": "Bank interest yield detected." }
      ]
    }

  # --- EXPENSE PROMPTS ---
  cogs_validation_specialist: |
    Analyze this direct outflow against the core business industry ({{.CompanyIndustry}}). Verify if the item is a direct driver of delivery/inventory production or general administrative overhead.
    Select from: "VALIDATED_DIRECT_COGS", "RECLASSIFY_TO_OVERHEAD_EXPENSE".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "cogs_validation_decision",
      "candidates": [
        { "value": "VALIDATED_DIRECT_COGS", "confidence": 0.98, "reasoning": "Raw material batch acquisition maps cleanly to production workflows." }
      ]
    }

  operating_expense_specialist: |
    Review operational overhead outflows. Scan for high-probability signals of corporate co-mingling where an employee/owner uses business funds for personal consumption.
    Select from: "STANDARD_OVERHEAD", "PERSONAL_MIXIN_DETECTED".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "operating_expense_decision",
      "candidates": [
        { "value": "STANDARD_OVERHEAD", "confidence": 1.00, "reasoning": "Subscription utility matching known SaaS tooling." }
      ]
    }

  other_expense_gate_specialist: |
    Analyze miscellaneous or non-operating cash outflows. Differentiate between penalties/fines, interest paid, or other non-operating expenses.
    Select from: "PENALTY_OR_FINE", "INTEREST_EXPENSE", "STANDARD_OTHER_EXPENSE".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "other_expense_gate_decision",
      "candidates": [
        { "value": "PENALTY_OR_FINE", "confidence": 1.00, "reasoning": "Late payment fee identified." }
      ]
    }

  # --- LIABILITIES PROMPTS ---
  credit_cards_gate_specialist: |
    Verify if the bank outflow represents a clear corporate credit card balance transfer or settlement payment (e.g., "AMEX ACH", "CHASE CARD PMT").
    Select from: "CC_BALANCE_TRANSFER", "ANOMALOUS_CC_FLOW".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "credit_cards_gate_decision",
      "candidates": [
        { "value": "CC_BALANCE_TRANSFER", "confidence": 1.00, "reasoning": "Direct automated clearing house transfer trace matching Visa subledger payload." }
      ]
    }

  other_current_liability_gate_specialist: |
    Isolate short-term statutory cash withholdings from operational cash flows.
    Select from: "SALES_TAX_COLLECTED", "PAYROLL_TAX_WITHHELD", "DEFAULT_OPERATIONAL_FLOW".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "other_current_liability_gate_decision",
      "candidates": [
        { "value": "SALES_TAX_COLLECTED", "confidence": 1.00, "reasoning": "State point of sale transaction payload parsing indicator." }
      ]
    }

  long_term_liability_gate_specialist: |
    Triage long-term cash payouts into formal amortization schedules.
    Select from: "LOAN_REPAYMENT_SPLIT", "UNIDENTIFIED_DEBT_FLOW".
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "long_term_liability_gate_decision",
      "candidates": [
        { "value": "LOAN_REPAYMENT_SPLIT", "confidence": 1.00, "reasoning": "Note identification index matches SBA amortized registry." }
      ]
    }

  counterparty_resolver: |
    Isolate the true corporate counterparty entity (Vendor or Customer name) by stripping locations, branch numbers, dates, and terminal IDs from the description string.
    
    Your response must be a valid JSON object containing an array of choices with confidence weights totaling exactly 1.0.
    
    EXPECTED OUTPUT FORMAT:
    {
      "property": "counterparty",
      "candidates": [
        { "value": "Amazon Web Services", "confidence": 1.00, "reasoning": "Stripped location tags and localized reference IDs." }
      ]
    }

# ====================================================================
# DIRECTED ACYCLIC GRAPH (DAG) TOPOLOGY
# ====================================================================
dag:
  entry_node: direction_router
  nodes:

    # ------------------------------------------------------------------
    # STEP 0: CASH DIRECTION ROUTING
    # ------------------------------------------------------------------
    direction_router:
      kind: cash_direction_router
      batch_size: 50
      edge_type: static
      children:
        INFLOW: macro_classifier_inflow
        OUTFLOW: macro_classifier_outflow

    # ------------------------------------------------------------------
    # STEP 1: MACRO CLASSIFICATION
    # ------------------------------------------------------------------
    macro_classifier_inflow:
      kind: macro_classifier
      prompt_key: macro_classifier_inflow_specialist
      batch_size: 50
      batch_flush_seconds: 5
      edge_type: static
      children:
        ASSET: account_type_asset
        LIABILITY: account_type_liability
        EQUITY: account_type_equity
        REVENUE: account_type_revenue
        EXPENSE: account_type_expense

    macro_classifier_outflow:
      kind: macro_classifier
      prompt_key: macro_classifier_outflow_specialist
      batch_size: 50
      batch_flush_seconds: 5
      edge_type: static
      children:
        ASSET: account_type_asset
        LIABILITY: account_type_liability
        EQUITY: account_type_equity
        REVENUE: account_type_revenue
        EXPENSE: account_type_expense

    # ------------------------------------------------------------------
    # STEP 2: SEGREGATED ACCOUNT TYPE CLASSIFICATION
    # ------------------------------------------------------------------
    account_type_asset:
      kind: account_type
      prompt_key: account_type_asset_specialist
      edge_type: static
      children:
        "Bank": bank
        "Fixed Assets": fixed_assets
        "Leasehold Improvements": leasehold_improvements
        "Other Current Assets": other_current_assets
        "Other Assets": other_assets
        "Accounts Receivable": accounts_receivable

    account_type_liability:
      kind: account_type
      prompt_key: account_type_liability_specialist
      edge_type: static
      children:
        "Credit Cards": credit_cards
        "Long Term Liability": long_term_liability
        "Other Current Liability": other_current_liability
        "Accounts Payable": accounts_payable

    account_type_equity:
      kind: account_type
      prompt_key: account_type_equity_specialist
      edge_type: static
      children:
        "Equity": equity

    account_type_revenue:
      kind: account_type
      prompt_key: account_type_revenue_specialist
      edge_type: static
      children:
        "Income": income
        "Other Income": other_income

    account_type_expense:
      kind: account_type
      prompt_key: account_type_expense_specialist
      edge_type: static
      children:
        "Cost of Goods Sold": cost_of_goods_sold
        "Expense": expense
        "Other Expense": other_expense

    # ==================================================================
    # STEP 3: SPECIFIC ASSETS SUB-GRAPH GATES (CASH BASIS)
    # ==================================================================
    bank:
      kind: holding_gate
      prompt_key: bank_gate_specialist
      batch_size: 50
      edge_type: static
      children:
        INTERNAL_TRANSFER: terminal_bank_transfer_collapse
        TREASURY_CASH_SWEEP: terminal_bank_transfer_collapse
        STANDARD_LIQUIDITY_FLOW: entity_outflow

    terminal_bank_transfer_collapse:
      kind: terminal
      execution_parameters:
        action_provider: "qbo_inter_bank_transfer_collapse"
        close_status: "COLLAPSED"

    fixed_assets:
      kind: holding_gate
      prompt_key: fixed_assets_gate_specialist
      batch_size: 20
      edge_type: static
      children:
        CAPITALIZE_ASSET: entity_outflow
        DE_MINIMIS_EXPENSE_TRIGGER: forced_expense_reclassification

    forced_expense_reclassification:
      kind: holding_gate
      batch_size: 1
      edge_type: static
      execution_parameters:
        action_provider: "reclassify_to_de_minimis_expense_account"
      resume_child: entity_outflow

    leasehold_improvements:
      kind: holding_gate
      prompt_key: leasehold_improvements_gate_specialist
      batch_size: 10
      edge_type: static
      children:
        CAPITALIZE_IMPROVEMENT: entity_outflow
        REPAIRS_MAINTENANCE_EXPENSE: forced_expense_reclassification

    other_current_assets:
      kind: holding_gate
      prompt_key: other_current_assets_gate_specialist
      batch_size: 30
      edge_type: static
      children:
        INVENTORY_PREPAYMENT: inventory_deposit_quarantine
        SECURITY_DEPOSIT: entity_outflow
        STANDARD_CURRENT_ASSET: entity_outflow

    inventory_deposit_quarantine:
      kind: holding_gate
      batch_size: 1
      edge_type: static
      hold_state_signal: "HOLD_MISSING_CONTEXT"
      hold_reason_string: "Cash paid for inventory stock deployment. Awaiting ultimate vendor receipt verification."
      resume_child: entity_outflow

    other_assets:
      kind: holding_gate
      prompt_key: other_assets_gate_specialist
      batch_size: 10
      edge_type: static
      children:
        INTANGIBLE_ASSET: entity_outflow
        LONG_TERM_SECURITY_DEPOSIT: entity_outflow
        STANDARD_OTHER_ASSET: entity_outflow

    accounts_receivable:
      kind: holding_gate
      batch_size: 1
      edge_type: static
      hold_state_signal: "HOLD_AMBIGUOUS"
      hold_reason_string: "CRITICAL: Accounts Receivable option triggered under active Cash-Basis execution pipeline. Halted for manual reconciliation compliance."
      resume_child: entity_outflow

    # ==================================================================
    # STEP 4: SPECIFIC LIABILITIES SUB-GRAPH GATES (CASH BASIS)
    # ==================================================================
    credit_cards:
      kind: holding_gate
      prompt_key: credit_cards_gate_specialist
      batch_size: 50
      edge_type: static
      children:
        CC_BALANCE_TRANSFER: terminal_credit_card_transfer
        ANOMALOUS_CC_FLOW: entity_outflow

    terminal_credit_card_transfer:
      kind: terminal
      execution_parameters:
        action_provider: "qbo_credit_card_payment_transfer_collapse"
        close_status: "COLLAPSED"

    long_term_liability:
      kind: holding_gate
      prompt_key: long_term_liability_gate_specialist
      batch_size: 1
      edge_type: static
      children:
        LOAN_REPAYMENT_SPLIT: loan_amortization
        UNIDENTIFIED_DEBT_FLOW: entity_outflow

    loan_amortization:
      kind: holding_gate
      batch_size: 1
      edge_type: static
      hold_state_signal: "HOLD_AMORTIZATION_LOOKUP"
      hold_reason_string: "Cash loan repayment demands real-time split amortization lookup to isolate principal from interest expense lines."
      execution_parameters:
        action_provider: "db_loan_matrix_lookup"
      resume_child: entity_outflow

    other_current_liability:
      kind: holding_gate
      prompt_key: other_current_liability_gate_specialist
      batch_size: 50
      edge_type: static
      children:
        SALES_TAX_COLLECTED: cash_sales_tax_splitter
        PAYROLL_TAX_WITHHELD: cash_payroll_withholding_gate
        DEFAULT_OPERATIONAL_FLOW: entity_outflow

    cash_sales_tax_splitter:
      kind: holding_gate
      batch_size: 25
      edge_type: static
      execution_parameters:
        action_provider: "extract_and_post_cash_sales_tax_liability"
      children:
        TAX_POSTED: entity_outflow

    cash_payroll_withholding_gate:
      kind: holding_gate
      batch_size: 10
      edge_type: static
      execution_parameters:
        action_provider: "isolate_employee_withholding_from_cash_payout"
      resume_child: entity_outflow

    accounts_payable:
      kind: holding_gate
      batch_size: 1
      edge_type: static
      hold_state_signal: "HOLD_AMBIGUOUS"
      hold_reason_string: "CRITICAL: Accounts Payable option triggered under active Cash-Basis execution pipeline. Halted for manual reconciliation compliance."
      resume_child: entity_outflow

    # ==================================================================
    # STEP 5: SPECIFIC EQUITY SUB-GRAPH GATES (CASH BASIS)
    # ==================================================================
    equity:
      kind: holding_gate
      prompt_key: equity_flow_specialist
      batch_size: 20
      edge_type: static
      children:
        OWNER_INVESTMENT: entity_outflow
        OWNER_DRAW: terminal_shareholder_draw_mitigation
        SHAREHOLDER_DISTRIBUTION: terminal_shareholder_draw_mitigation

    terminal_shareholder_draw_mitigation:
      kind: terminal
      execution_parameters:
        action_provider: "equity_draw_balance_sheet_collapse"
        close_status: "COLLAPSED"

    # ==================================================================
    # STEP 6: SPECIFIC REVENUE SUB-GRAPH GATES (CASH BASIS)
    # ==================================================================
    income:
      kind: holding_gate
      prompt_key: operating_income_specialist
      batch_size: 50
      edge_type: static
      children:
        GROMENT_STRIPE_SQUARE_SPLIT: merchant_payout_splitter
        STANDARD_CASH_RECEIPT: entity_outflow

    merchant_payout_splitter:
      kind: holding_gate
      batch_size: 25
      edge_type: static
      execution_parameters:
        action_provider: "gross_up_merchant_processing_fees_split"
      children:
        MERCHANT_FEES_ISOLATED: entity_outflow

    other_income:
      kind: holding_gate
      prompt_key: other_income_gate_specialist
      batch_size: 50
      edge_type: static
      children:
        INTEREST_DIVIDEND_INCOME: entity_outflow
        STANDARD_OTHER_INCOME: entity_outflow

    # ==================================================================
    # STEP 7: SPECIFIC EXPENSE SUB-GRAPH GATES (CASH BASIS)
    # ==================================================================
    cost_of_goods_sold:
      kind: holding_gate
      prompt_key: cogs_validation_specialist
      batch_size: 40
      edge_type: static
      children:
        VALIDATED_DIRECT_COGS: entity_outflow
        RECLASSIFY_TO_OVERHEAD_EXPENSE: forced_overhead_reclassification

    forced_overhead_reclassification:
      kind: holding_gate
      batch_size: 1
      edge_type: static
      execution_parameters:
        action_provider: "reclassify_to_operating_overhead_expense"
      resume_child: entity_outflow

    expense:
      kind: holding_gate
      prompt_key: operating_expense_specialist
      batch_size: 50
      edge_type: static
      children:
        STANDARD_OVERHEAD: entity_outflow
        PERSONAL_MIXIN_DETECTED: terminal_shareholder_draw_mitigation

    other_expense:
      kind: holding_gate
      prompt_key: other_expense_gate_specialist
      batch_size: 50
      edge_type: static
      children:
        PENALTY_OR_FINE: entity_outflow
        INTEREST_EXPENSE: entity_outflow
        STANDARD_OTHER_EXPENSE: entity_outflow

    # ==================================================================
    # STEP 8: UNIVERSAL DATA CLOSING PIPELINE
    # ==================================================================
    entity_outflow:
      kind: entity
      prompt_key: counterparty_resolver
      edge_type: static
      children:
        DEFAULT: account_selection

    account_selection:
      kind: account_selection
      edge_type: dynamic
      dynamic_edge_provider: "db_chart_of_accounts"
      batch_size: 15
      batch_flush_seconds: 3

