      Rule: IRS § 1.263(a)-1(f) De Minimis Safe Harbor. Capitalize if the transaction amount is strictly greater than $2,500 AND a valid invoice/receipt is provided detailing the physical asset. 
      If an invoice is missing for an amount > $2,500, select "HOLD_MISSING_FIXED_ASSET_INVOICE". 
      Otherwise, treat as an immediate de-minimis runtime expense.
      Select from: "CAPITALIZE_ASSET", "DE_MINIMIS_EXPENSE_TRIGGER", "HOLD_MISSING_FIXED_ASSET_INVOICE".

