        EXPECTED OUTPUT FORMAT:
        [
          {
            "op": "add",
            "path": "/rows",
            "value": {
              "row_id_1": {
              "property": "credit_cards_gate_decision",
              "candidates": {
              "1": { "value": "CC_BALANCE_TRANSFER", "confidence": 0.99, "reasoning": "Direct automated clearing house transfer trace matching subledger payload." },
              "2": { "value": "ANOMALOUS_CC_FLOW", "confidence": 0.01, "reasoning": "Safeguard sweep boundary." }
                }
              }
            }
          }
        ]

  other_current_liability_gate_specialist:
    - |
      Isolate short-term statutory cash withholdings from operational cash flows, and identify when those withheld taxes are remitted to authorities.
      Select from: "TVA_COLLECTED", "CNSS_IR_WITHHELD", "TAX_REMITTANCE", "DEFAULT_OPERATIONAL_FLOW".
    - *guardrails
    - *accounting_rules
    - |
        EXPECTED OUTPUT FORMAT:
        [
          {
            "op": "add",
            "path": "/rows",
            "value": {
              "row_id_1": {
              "property": "other_current_liability_gate_decision",
              "candidates": {
              "1": { "value": "TVA_COLLECTED", "confidence": 0.98, "reasoning": "TVA point of sale transaction payload parsing indicator." },
              "2": { "value": "DEFAULT_OPERATIONAL_FLOW", "confidence": 0.02, "reasoning": "Fallback threshold." }
                }
              }
            }
          }
        ]

  long_term_liability_gate_specialist:
    - |
      Triage long-term cash payouts into formal amortization schedules, or identify incoming loan disbursements.
      Select from: "LOAN_REPAYMENT_SPLIT", "LOAN_DISBURSEMENT_RECEIVED", "UNIDENTIFIED_DEBT_FLOW".
    - *guardrails
    - *accounting_rules
    - |
        EXPECTED OUTPUT FORMAT:
        [
          {
            "op": "add",
            "path": "/rows",
            "value": {
              "row_id_1": {
              "property": "long_term_liability_gate_decision",
              "candidates": {
              "1": { "value": "LOAN_REPAYMENT_SPLIT", "confidence": 0.99, "reasoning": "Note identification index matches bank amortized registry." },
              "2": { "value": "UNIDENTIFIED_DEBT_FLOW", "confidence": 0.01, "reasoning": "Threshold boundary safety check." }
                }
              }
            }
          }
        ]

  expense_compliance_specialist:
    - |
      You are a rigorous auditor evaluating standard operational expenses under Moroccan General Tax Code (CGI).
      Apply the following rules to this transaction:

      1. Meals & Entertainment: If the transaction is for Meals & Entertainment, you must select "HOLD_MISSING_MEAL_DOCUMENTATION" unless the exact business purpose and names of attendees are explicitly provided in the transaction context or receipt.
      2. Invoice Requirement: Every business expense must be backed by a conforming invoice (facture conforme). You must select "HOLD_MISSING_RECEIPT" unless a valid invoice/receipt is provided in the attachments or transaction context.
      3. Cash Payment Limitation (CGI Art. 193): If the transaction payment method is cash and the amount is strictly greater than 5,000 MAD, select "HOLD_MISSING_RECEIPT" (or flag for compliance audit) because cash payments exceeding 5,000 MAD per day per supplier are non-deductible.
      4. If the transaction has valid documentation satisfying the rules above, and is NOT Meals & Entertainment, select "COMPLIANT_EXPENSE".
    - *guardrails
    - *accounting_rules
    - |
        EXPECTED OUTPUT FORMAT:
        [
          {
            "op": "add",
            "path": "/rows",
            "value": {
              "row_id_1": {
              "property": "expense_compliance_decision",
              "candidates": {
              "1": { "value": "COMPLIANT_EXPENSE", "confidence": 0.99, "reasoning": "Compliant invoice." },
              "2": { "value": "HOLD_MISSING_RECEIPT", "confidence": 0.01, "reasoning": "Missing facture conforme." },
              "3": { "value": "HOLD_MISSING_MEAL_DOCUMENTATION", "confidence": 0.00, "reasoning": "Missing business purpose and attendees." }
                }
              }
            }
          }
        ]

  other_expense_compliance_specialist:
    - |
      You are a rigorous auditor evaluating non-operating expenses under Moroccan General Tax Code (CGI).
      Apply the following rule:

      1. Charitable Contributions (CGI Art. 10): Donations are only deductible if made to authorized public interest associations and are capped at 2‰ (two per thousand) of the company's annual turnover. If the donation is not to an authorized body, or needs limit review, select "HOLD_MISSING_CHARITY_ACKNOWLEDGEMENT".
      2. Otherwise, select "COMPLIANT_OTHER_EXPENSE".
    - *guardrails
    - *accounting_rules
    - |
        EXPECTED OUTPUT FORMAT:
        [
          {
            "op": "add",
            "path": "/rows",
            "value": {
              "row_id_1": {
              "property": "other_expense_compliance_decision",
              "candidates": {
              "1": { "value": "COMPLIANT_OTHER_EXPENSE", "confidence": 0.99, "reasoning": "Compliant." },
              "2": { "value": "HOLD_MISSING_CHARITY_ACKNOWLEDGEMENT", "confidence": 0.01, "reasoning": "Requires public interest status check." }
                }
              }
            }
          }
        ]

  universal_outflow_compliance_specialist:
    - |
      You are a rigorous auditor reviewing a cash outflow before finalizing the vendor counterparty under Moroccan CGI rules.
      Apply the following thresholds:

      1. Materiality Concept: If the transaction amount is >= 100,000 MAD, select "HOLD_MATERIALITY_REVIEW" to enforce secondary CPA sign-off to ensure no material misstatement.
      2. Withholding Tax (Retenue à la Source): If the transaction is a payment for professional services to a non-resident or local provider requiring tax withholding, select "HOLD_ICE_ID_REQUIRED" to check for conforming tax identification details (Identifiant Commun de l'Entreprise - ICE) on file.
      3. If neither rule is violated, select "COMPLIANT_OUTFLOW".
    - *guardrails
    - *accounting_rules
    - |
        EXPECTED OUTPUT FORMAT:
        [
          {
            "op": "add",
            "path": "/rows",
            "value": {
              "row_id_1": {
              "property": "outflow_compliance_decision",
              "candidates": {
              "1": { "value": "COMPLIANT_OUTFLOW", "confidence": 0.99, "reasoning": "Compliant." },
              "2": { "value": "HOLD_MATERIALITY_REVIEW", "confidence": 0.01, "reasoning": "Over 100,000 MAD limit." }
                }
              }
            }
          }
        ]

  account_selection_prompt:
    - |
      You are an expert accountant. Select the exact account ID from the Chart of Accounts that best matches the transaction. Do it in these steps:
      1. Isolate the true corporate vendor or customer entity name by stripping locations, branch numbers, dates, and terminal IDs from the description string.
      2. Review the 'trace' array provided in the transaction row. This trace contains classifications from prior steps, telling you whether this is an INFLOW/OUTFLOW, PCGE Class (1-7), etc.
      3. Use the 'trace' history combined with the isolated entity name to select the most accurate account from the appropriately categorized Chart of Accounts below.
      4. If the customer/vendor did not match any account in the Chart of Accounts, look for accounts like 'Uncategorized Income', 'Uncategorized Expense', 'Uncategorized Assets', 'Uncategorized Liabilities' etc and use that. 

      COMPANY CHART OF ACCOUNTS:
      {{.ChartOfAccounts}}

      You MUST select the SINGLE BEST account ID (the ID field) that matches. Do not make up an ID.
      If no account fits perfectly, select the closest general category.
      CRITICAL: Do NOT output just the ID. You MUST format your entire response exactly as a JSON Patch array as described below.

      CRITICAL RULES FOR BATCH PROCESSING:
      1. The USER REQUEST provides a map of transactions under the 'rows' key. The keys in this map are unique identifiers for each transaction.
      2. Your output MUST be a valid JSON array containing exactly ONE RFC 6902 JSON patch operation.
      3. This single patch MUST use exactly "op": "add" and "path": "/rows".
      4. The "value" of the patch MUST be an object where the keys are EXACTLY the unique transaction identifiers from the input.
    - *guardrails
    - |
        EXPECTED OUTPUT FORMAT:
        [
          {
            "op": "add",
            "path": "/rows",
            "value": {
              "row_id_1": {
              "property": "account_selection",
              "candidates": {
              "1": { "value": "account_id_1", "confidence": 0.99, "reasoning": "Account description matches transaction." },
              "2": { "value": "account_id_2", "confidence": 0.01, "reasoning": "Account description does not match transaction." }
                }
              }
            }
          }
        ]
# ====================================================================
# DIRECTED ACYCLIC GRAPH (DAG) TOPOLOGY - PCGE ADAPTATION (MOROCCO)
# ====================================================================
dag:
  entry_node: direction_router
  nodes:

    # ------------------------------------------------------------------
    # STEP 0: CASH DIRECTION ROUTING
    # ------------------------------------------------------------------
    direction_router:
      name: direction_router
      batch_flush_seconds: &flush 5
      kind: initial_router
      execution_parameters:
        payload_key: cash_direction
      batch_size: &bsize 50
      edge_type: &estatic static
      children:
        INFLOW: macro_classifier_inflow
        OUTFLOW: macro_classifier_outflow

    # ------------------------------------------------------------------
    # STEP 1: PCGE MACRO CLASS CLASSIFICATION
    # ------------------------------------------------------------------
    macro_classifier_inflow:
      name: macro_classifier_inflow
      kind: macro_classifier
      prompt_key: macro_classifier_inflow_pcge_specialist
      batch_size: *bsize
      batch_flush_seconds: *flush
      edge_type: *estatic
      children:
        CLASS_1_FINANCEMENT_PERMANENT: account_type_class_1
        CLASS_2_ACTIF_IMMOBILISE: account_type_class_2
        CLASS_3_ACTIF_CIRCULANT: account_type_class_3
        CLASS_4_PASSIF_CIRCULANT: account_type_class_4
        CLASS_5_TRESORERIE: account_type_class_5
        CLASS_6_CHARGES: account_type_class_6
        CLASS_7_PRODUITS: account_type_class_7

    macro_classifier_outflow:
      name: macro_classifier_outflow
      kind: macro_classifier
      prompt_key: macro_classifier_outflow_pcge_specialist
      batch_size: *bsize
      batch_flush_seconds: *flush
      edge_type: *estatic
      children:
        CLASS_1_FINANCEMENT_PERMANENT: account_type_class_1
        CLASS_2_ACTIF_IMMOBILISE: account_type_class_2
        CLASS_3_ACTIF_CIRCULANT: account_type_class_3
        CLASS_4_PASSIF_CIRCULANT: account_type_class_4
        CLASS_5_TRESORERIE: account_type_class_5
        CLASS_6_CHARGES: account_type_class_6
        CLASS_7_PRODUITS: account_type_class_7

    # ------------------------------------------------------------------
    # STEP 2: PCGE RUBRIQUE (ACCOUNT TYPE) CLASSIFICATION
    # ------------------------------------------------------------------
    account_type_class_1:
      name: account_type_class_1
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: account_type
      prompt_key: pcge_class_1_specialist
      edge_type: *estatic
      children:
        "Capitaux Propres (Equity)": equity
        "Dettes de Financement (Long Term Debt)": long_term_liability

    account_type_class_2:
      name: account_type_class_2
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: account_type
      prompt_key: pcge_class_2_specialist
      edge_type: *estatic
      children:
        "Immobilisations Incorporelles (Intangible)": other_assets
        "Immobilisations Corporelles (Fixed Assets)": fixed_assets
        "Immobilisations en Non-Valeurs (Leaseholds/Setup)": leasehold_improvements
        "Immobilisations Financières": other_assets

    account_type_class_3:
      name: account_type_class_3
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: account_type
      prompt_key: pcge_class_3_specialist
      edge_type: *estatic
      children:
        "Stocks (Inventory)": inventory_deposit_quarantine
        "Créances Clients (Accounts Receivable)": accounts_receivable
        "Autres Créances (Other Current Assets)": other_current_assets

    account_type_class_4:
      name: account_type_class_4
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: account_type
      prompt_key: pcge_class_4_specialist
      edge_type: *estatic
      children:
        "Dettes Fournisseurs (Accounts Payable)": accounts_payable
        "Etat et Organismes Sociaux (TVA/CNSS)": other_current_liability
        "Autres Dettes du Passif Circulant": other_current_liability

    account_type_class_5:
      name: account_type_class_5
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: account_type
      prompt_key: pcge_class_5_specialist
      edge_type: *estatic
      children:
        "Trésorerie Actif (Bank/Cash)": bank
        "Trésorerie Passif (Credit Cards/Overdrafts)": credit_cards

    account_type_class_6:
      name: account_type_class_6
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: account_type
      prompt_key: pcge_class_6_specialist
      edge_type: *estatic
      children:
        "Achats Revendus ou Consommés (COGS)": cost_of_goods_sold
        "Autres Charges Externes (Operating Expense)": expense
        "Charges Financières et Non Courantes": other_expense

    account_type_class_7:
      name: account_type_class_7
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: account_type
      prompt_key: pcge_class_7_specialist
      edge_type: *estatic
      children:
        "Produits d'Exploitation (Operating Income)": income
        "Produits Financiers et Non Courants": other_income

    # ==================================================================
    # STEP 3: SPECIFIC ASSETS SUB-GRAPH GATES (CLASS 2, 3, 5)
    # ==================================================================
    bank:
      name: bank
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: bank_gate_specialist
      batch_size: *bsize
      auto_advance: false
      edge_type: *estatic
      children:
        debug_terminal: debug_terminal
        # INTERNAL_TRANSFER: terminal_bank_transfer_collapse
        # TREASURY_CASH_SWEEP: terminal_bank_transfer_collapse
        # STANDARD_LIQUIDITY_FLOW: universal_outflow_compliance_gate

    terminal_bank_transfer_collapse:
      name: terminal_bank_transfer_collapse
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: terminal
      execution_parameters:
        action_provider: "inter_bank_transfer_collapse"
        close_status: "CLASSIFIED"

    fixed_assets:
      name: fixed_assets
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: fixed_assets_gate_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        debug_terminal: debug_terminal
        # CAPITALIZE_ASSET: universal_outflow_compliance_gate
        # DE_MINIMIS_EXPENSE_TRIGGER: forced_expense_reclassification
        # HOLD_MISSING_FIXED_ASSET_INVOICE: hold_missing_fixed_asset_invoice

    hold_missing_fixed_asset_invoice:
      name: hold_missing_fixed_asset_invoice
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      hold_state_signal: "HOLD_MISSING_DOCUMENTATION"
      hold_reason_string: "Capitalizing an asset > 500 MAD strictly requires a valid invoice detailing the physical asset."
      recovery_policy:
        type: action
        actions: ["search_document_store", "queue_client_request"]
      email:
        subject: "Action Required: Missing Fixed Asset Invoice"
        body_text: |
          Hi there,

          We got a transaction for a recent purchase of {{.RawAmount}} MAD for {{.RawDescription}}. This is likely related to fixed assets, but we require a copy of the invoice (facture conforme) for accounting purposes.

          Please reply to this email with the invoice attached.

          Thank you.
      execution_parameters:
        action_provider: "db_receipt_lookup"
      resume_child: universal_outflow_compliance_gate

    forced_expense_reclassification:
      name: forced_expense_reclassification
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      execution_parameters:
        action_provider: "reclassify_to_de_minimis_expense_account"
      resume_child: universal_outflow_compliance_gate

    leasehold_improvements:
      name: leasehold_improvements
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: leasehold_improvements_gate_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        debug_terminal: debug_terminal
        # CAPITALIZE_IMPROVEMENT: account_selection
        # REPAIRS_MAINTENANCE_EXPENSE: forced_expense_reclassification

    other_current_assets:
      name: other_current_assets
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: other_current_assets_gate_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        debug_terminal: debug_terminal
        # SECURITY_DEPOSIT: universal_outflow_compliance_gate
        # STANDARD_CURRENT_ASSET: universal_outflow_compliance_gate

    inventory_deposit_quarantine:
      name: inventory_deposit_quarantine
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      hold_state_signal: "HOLD_MISSING_CONTEXT"
      hold_reason_string: "Cash paid for inventory stock deployment. Awaiting ultimate vendor receipt verification."
      email:
        subject: "Action Required: Missing Inventory Receipt"
        body_text: |
          Hi there,
          We noticed an inventory-related payment of {{.RawAmount}} MAD for {{.RawDescription}}. Please reply to this email with the final vendor receipt to attach to this transaction for accounting purposes.

          Thank you.
      resume_child: universal_outflow_compliance_gate

    other_assets:
      name: other_assets
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: other_assets_gate_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        debug_terminal: debug_terminal
        # INTANGIBLE_ASSET: universal_outflow_compliance_gate
        # LONG_TERM_SECURITY_DEPOSIT: universal_outflow_compliance_gate
        # STANDARD_OTHER_ASSET: universal_outflow_compliance_gate

    accounts_receivable:
      name: accounts_receivable
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      hold_state_signal: "HOLD_AMBIGUOUS"
      hold_reason_string: "CRITICAL: Accounts Receivable option triggered under active Cash-Basis execution pipeline. Halted for manual reconciliation compliance."
      email:
        subject: "Clarification Needed: Accounts Receivable Transaction"
        body_text: |
          Hi there,

          We got a potential Accounts Receivable transaction of {{.RawAmount}} MAD for {{.RawDescription}}. Could you please clarify if this represents a customer payment or something else?

          Thank you
      resume_child: universal_outflow_compliance_gate

    # ==================================================================
    # STEP 4: SPECIFIC LIABILITIES SUB-GRAPH GATES (CLASS 1, 4, 5)
    # ==================================================================
    credit_cards:
      name: credit_cards
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: credit_cards_gate_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        CC_BALANCE_TRANSFER: terminal_credit_card_transfer
        CC_REFUND_OR_REWARD: account_selection
        ANOMALOUS_CC_FLOW: universal_outflow_compliance_gate

    terminal_credit_card_transfer:
      name: terminal_credit_card_transfer
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: terminal
      execution_parameters:
        action_provider: "credit_card_payment_transfer_collapse"
        close_status: "CLASSIFIED"

    long_term_liability:
      name: long_term_liability
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: long_term_liability_gate_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        LOAN_REPAYMENT_SPLIT: loan_amortization
        LOAN_DISBURSEMENT_RECEIVED: account_selection
        UNIDENTIFIED_DEBT_FLOW: universal_outflow_compliance_gate

    loan_amortization:
      name: loan_amortization
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      hold_state_signal: "HOLD_AMORTIZATION_LOOKUP"
      hold_reason_string: "Cash loan repayment demands real-time split amortization lookup to isolate principal from interest expense lines."
      email:
        subject: "Action Required: Loan Repayment Schedule"
        body_text: |
          Hi there,

          We recorded a loan repayment of {{.RawAmount}} MAD for {{.RawDescription}}. To properly record this, please provide us with the loan statement/tableau d'amortissement.

          Thank you.
      execution_parameters:
        action_provider: "db_loan_matrix_lookup"
      resume_child: universal_outflow_compliance_gate

    other_current_liability:
      name: other_current_liability
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: other_current_liability_gate_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        TVA_COLLECTED: tva_splitter
        CNSS_IR_WITHHELD: payroll_cnss_ir_withholding_gate
        TAX_REMITTANCE: universal_outflow_compliance_gate
        DEFAULT_OPERATIONAL_FLOW: universal_outflow_compliance_gate

    tva_splitter:
      name: tva_splitter
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      execution_parameters:
        action_provider: "extract_and_post_tva_liability"
      children:
        TAX_POSTED: universal_outflow_compliance_gate

    payroll_cnss_ir_withholding_gate:
      name: payroll_cnss_ir_withholding_gate
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      execution_parameters:
        action_provider: "isolate_cnss_ir_withholding_from_payout"
      resume_child: universal_outflow_compliance_gate

    accounts_payable:
      name: accounts_payable
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      hold_state_signal: "HOLD_AMBIGUOUS"
      hold_reason_string: "CRITICAL: Accounts Payable option triggered under active Cash-Basis execution pipeline. Halted for manual reconciliation compliance."
      email:
        subject: "Clarification Needed: Accounts Payable Transaction"
        body_text: |
          Hi there,

          We got a potential Accounts Payable transaction of {{.RawAmount}} MAD for {{.RawDescription}}. Could you please clarify if this represents a vendor payment or something else?

          Thank you.
      resume_child: universal_outflow_compliance_gate

    # ==================================================================
    # STEP 5: SPECIFIC EQUITY SUB-GRAPH GATES (CLASS 1)
    # ==================================================================
    equity:
      name: equity
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: equity_flow_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        OWNER_INVESTMENT: account_selection
        OWNER_DRAW: terminal_shareholder_draw_mitigation
        SHAREHOLDER_DISTRIBUTION: terminal_shareholder_draw_mitigation

    terminal_shareholder_draw_mitigation:
      name: terminal_shareholder_draw_mitigation
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: terminal
      execution_parameters:
        action_provider: "equity_draw_balance_sheet_collapse"
        close_status: "CLASSIFIED"

    # ==================================================================
    # STEP 6: SPECIFIC REVENUE SUB-GRAPH GATES (CLASS 7)
    # ==================================================================
    income:
      name: income
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: operating_income_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        GROMENT_STRIPE_SQUARE_SPLIT: merchant_payout_splitter
        CUSTOMER_REFUND: universal_outflow_compliance_gate
        STANDARD_CASH_RECEIPT: account_selection

    merchant_payout_splitter:
      name: merchant_payout_splitter
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      execution_parameters:
        action_provider: "gross_up_merchant_processing_fees_split"
      children:
        MERCHANT_FEES_ISOLATED: account_selection

    other_income:
      name: other_income
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: other_income_gate_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        INTEREST_DIVIDEND_INCOME: account_selection
        STANDARD_OTHER_INCOME: account_selection

    # ==================================================================
    # STEP 7: SPECIFIC EXPENSE SUB-GRAPH GATES (CLASS 6)
    # ==================================================================
    cost_of_goods_sold:
      name: cost_of_goods_sold
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: cogs_validation_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        VALIDATED_DIRECT_COGS: universal_outflow_compliance_gate
        RECLASSIFY_TO_OVERHEAD_EXPENSE: forced_overhead_reclassification

    forced_overhead_reclassification:
      name: forced_overhead_reclassification
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      execution_parameters:
        action_provider: "reclassify_to_operating_overhead_expense"
      resume_child: universal_outflow_compliance_gate

    expense:
      name: expense
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: operating_expense_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        STANDARD_OVERHEAD: expense_compliance_router
        VENDOR_REFUND: account_selection
        PERSONAL_MIXIN_DETECTED: terminal_shareholder_draw_mitigation

    expense_compliance_router:
      name: expense_compliance_router
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: expense_compliance_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        COMPLIANT_EXPENSE: universal_outflow_compliance_gate
        HOLD_MISSING_RECEIPT: hold_missing_receipt
        HOLD_MISSING_MEAL_DOCUMENTATION: hold_missing_meal_documentation

    hold_missing_receipt:
      name: hold_missing_receipt
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      hold_state_signal: "HOLD_MISSING_DOCUMENTATION"
      hold_reason_string: "Expense requires a conforming invoice (facture conforme) for compliance."
      recovery_policy:
        type: action
        actions: ["search_document_store", "queue_client_request"]
      email:
        subject: "Action Required: Missing Facture Conforme"
        body_text: |
          Hi there,

          We got a charge of {{.RawAmount}} MAD for {{.RawDescription}}. 
          Please reply to this email with a picture or PDF of the conforming invoice (facture conforme) so we can properly categorize it.

          Thank you.
      execution_parameters:
        action_provider: "db_receipt_lookup"
      resume_child: universal_outflow_compliance_gate

    hold_missing_meal_documentation:
      name: hold_missing_meal_documentation
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      hold_state_signal: "HOLD_MISSING_DOCUMENTATION"
      hold_reason_string: "Meals & Entertainment expenses require business purpose and attendees."
      recovery_policy:
        type: action
        actions: ["queue_client_request"]
      email:
        subject: "Action Required: Missing Meal Attendees and Business Purpose"
        body_text: |
          Hi there,

          We got a meals or entertainment expense of {{.RawAmount}} MAD for {{.RawDescription}}. Could you please provide us with the attendees and business purpose of this meal?

          Thank you.
      execution_parameters:
        action_provider: "db_receipt_lookup"
      resume_child: universal_outflow_compliance_gate

    other_expense:
      name: other_expense
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: other_expense_gate_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        PENALTY_OR_FINE: universal_outflow_compliance_gate
        INTEREST_EXPENSE: universal_outflow_compliance_gate
        STANDARD_OTHER_EXPENSE: other_expense_compliance_router

    other_expense_compliance_router:
      name: other_expense_compliance_router
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: other_expense_compliance_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        COMPLIANT_OTHER_EXPENSE: universal_outflow_compliance_gate
        HOLD_MISSING_CHARITY_ACKNOWLEDGEMENT: hold_missing_charity_acknowledgement

    hold_missing_charity_acknowledgement:
      name: hold_missing_charity_acknowledgement
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      hold_state_signal: "HOLD_MISSING_DOCUMENTATION"
      hold_reason_string: "Charitable Contributions require checking public interest status and written acknowledgement."
      recovery_policy:
        type: action
        actions: ["search_document_store", "queue_client_request"]
      email:
        subject: "Action Required: Missing Charitable Donation Acknowledgement"
        body_text: |
          Hi there,

          We got a charitable donation of {{.RawAmount}} MAD for {{.RawDescription}}. Donations require verification of public utility status and formal written acknowledgement from the charity. Please provide us with that letter.

          Thank you.
      execution_parameters:
        action_provider: "db_receipt_lookup"
      resume_child: universal_outflow_compliance_gate

    # ==================================================================
    # STEP 8: UNIVERSAL DATA CLOSING PIPELINE
    # ==================================================================
    universal_outflow_compliance_gate:
      name: universal_outflow_compliance_gate
      batch_flush_seconds: *flush
      kind: holding_gate
      prompt_key: universal_outflow_compliance_specialist
      batch_size: *bsize
      edge_type: *estatic
      children:
        COMPLIANT_OUTFLOW: account_selection
        HOLD_MATERIALITY_REVIEW: hold_materiality_review
        HOLD_ICE_ID_REQUIRED: hold_ice_id_required

    hold_materiality_review:
      name: hold_materiality_review
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      hold_state_signal: "HOLD_CPA_REVIEW"
      hold_reason_string: "Transaction exceeds PCM materiality threshold (100,000 MAD) and requires CPA sign-off."
      recovery_policy:
        type: action
        actions: ["human_review"]
      email:
        subject: "Action Required: Material Transaction Review"
        body_text: |
          Hi there,

          We got a large transaction of {{.RawAmount}} MAD for {{.RawDescription}}. Could you please provide any supporting documentation (invoice, contract, etc.) related to this transaction?

          Thank you.
      execution_parameters:
        action_provider: "hitl_materiality_review"
      resume_child: universal_outflow_compliance_gate

    hold_ice_id_required:
      name: hold_ice_id_required
      batch_flush_seconds: *flush
      kind: holding_gate
      batch_size: *bsize
      edge_type: *estatic
      hold_state_signal: "HOLD_MISSING_DOCUMENTATION"
      hold_reason_string: "Service payment to contractor requires Tax Identification details (Identifiant Commun de l'Entreprise / ICE)."
      recovery_policy:
        type: action
        actions: ["search_document_store", "queue_client_request"]
      email:
        subject: "Action Required: Missing Tax ID (ICE) for Contractor"
        body_text: |
          Hi there,

          We got a service payment of {{.RawAmount}} MAD for {{.RawDescription}}. We are required to have the tax identification number (Identifiant Fiscal / ICE) on file for this provider. Could you please provide us with a copy of their tax details or a conforming invoice?

          Thank you.
      execution_parameters:
        action_provider: "db_ice_lookup"
      resume_child: universal_outflow_compliance_gate

    account_selection:
      name: account_selection
      kind: terminal
      prompt_key: account_selection_prompt
      edge_type: dynamic
      dynamic_edge_provider: "db_chart_of_accounts"
      batch_size: *bsize
      batch_flush_seconds: *flush
      execution_parameters:
        close_status: "CLASSIFIED"

    debug_terminal:
      name: debug_terminal
      batch_size: *bsize
      batch_flush_seconds: *flush
      kind: terminal
