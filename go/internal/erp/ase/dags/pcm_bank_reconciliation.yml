  # ====================================================================
  # DOWNSTREAM GATE SPECIALISTS
  # ====================================================================

  bank_gate_specialist:
    - |
      Analyze the bank transaction. Determine if it represents an internal liquidity movement between company bank profiles (e.g. transfers, virements), a cash sweep into treasury, or standard cash operational deployment.
      Select from: "INTERNAL_TRANSFER", "TREASURY_CASH_SWEEP", "STANDARD_LIQUIDITY_FLOW".
    - *guardrails
    - *accounting_rules
    - |
        EXPECTED OUTPUT FORMAT:
        [
          {
            "op": "add",
            "path": "/rows",
            "value": {
              "row_id_1": {
              "property": "bank_gate_decision",
              "candidates": {
              "1": { "value": "STANDARD_LIQUIDITY_FLOW", "confidence": 0.85, "reasoning": "Unclear virement matching; safely holding for context." },
              "2": { "value": "INTERNAL_TRANSFER", "confidence": 0.15, "reasoning": "Indicates some transfer signs but requires manual audit." }
                }
              }
            }
          }
        ]

  fixed_assets_gate_specialist:
    - |
      Examine the physical property, vehicle, software infrastructure, or equipment purchase under capitalization limits.
      Rule: Capitalize if the transaction amount is strictly greater than 500 MAD (excluding VAT) AND a valid invoice (facture conforme) is provided detailing the physical asset.
      If an invoice is missing for an amount > 500 MAD, select "HOLD_MISSING_FIXED_ASSET_INVOICE".
      Otherwise, treat as an immediate runtime operating expense ("DE_MINIMIS_EXPENSE_TRIGGER").
      Select from: "CAPITALIZE_ASSET", "DE_MINIMIS_EXPENSE_TRIGGER", "HOLD_MISSING_FIXED_ASSET_INVOICE".
    - *guardrails
    - *accounting_rules
    - |
        EXPECTED OUTPUT FORMAT:
        [
          {
            "op": "add",
            "path": "/rows",
            "value": {
              "row_id_1": {
              "property": "fixed_assets_gate_decision",
              "candidates": {
              "1": { "value": "CAPITALIZE_ASSET", "confidence": 0.99, "reasoning": "Transaction total exceeds the static 500 MAD threshold criteria and facture conforme is attached." },
              "2": { "value": "HOLD_MISSING_FIXED_ASSET_INVOICE", "confidence": 0.01, "reasoning": "Invoice missing." }
                }
              }
            }
          }
        ]

