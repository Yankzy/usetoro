hyper_parameters:
  confidence_threshold: 0.98
  auto_advance: true
  max_llm_retries: 3
  llm_timeout_seconds: 120
  batch_flush_seconds: 5
  active_agent_ttl_minutes: 10
  lock_ttl_seconds: 30
  domain_tool: "bookkeeping"

  # -----------------------------------------------------------------------
  # Vector Memory (ASE Semantic Retrieval Layer)
  # -----------------------------------------------------------------------
  vector_memory:
    # Master switch — set to false to disable semantic retrieval entirely.
    enabled: false

    # Embedding provider: "openai" or "google"
    # "openai" uses the existing LLMClient (text-embedding-3-small, 1536 dims)
    # "google" requires google_ml_integration extension + Vertex AI credentials
    embedding_provider: "openai"

    # OpenAI embedding model. Only used when embedding_provider = "openai".
    # text-embedding-3-small → 1536 dims (default, cost-efficient)
    # text-embedding-3-large → 3072 dims (highest accuracy)
    openai_embedding_model: "text-embedding-3-small"

    # Embedding vector dimensionality.
    # Must match the model: text-embedding-3-small=1536, text-embedding-3-large=3072
    # WARNING: changing this requires dropping and recreating the vector column + ScaNN index.
    embedding_dimensions: 1536

    # ScaNN index num_leaves tuning knob.
    # Best practice: start at sqrt(expected_row_count).
    # With no initial data, 10 is a safe cold-start value; raise as volume grows.
    # Valid range: 1–1048576.
    scann_num_leaves: 10

    # Number of semantically similar entries to retrieve per transaction during
    # the batchToRows enrichment step and inject as company_rules context.
    retrieval_top_k: 5

    # How often (in seconds) the background VectorHydrator runs to generate
    # embeddings for new memory_rules and high-confidence resolved transactions.
    hydrator_interval_seconds: 30

    # Minimum confidence score required for a resolved staging transaction to
    # be eligible for hydration into the vector memory store.
    hydrator_min_confidence: 0.98

    # Batch size for the hydrator's embedding generation loop per tick.
    hydrator_batch_size: 50

prompts:
  _shared_guardrails: &guardrails |
    ### CONFIDENCE GUARDRAILS
    - CRITICAL: "Confidence" does NOT mean "how sure are you of your answer". It means "should this transaction automatically progress to the next node of the DAG?". 
    - The system has a strict guardrail: if your top candidate's confidence is < 0.98, the transaction will be placed on HOLD and will NOT progress.
    - If the transaction is fully compliant and should progress, you MUST set the highest score to >= 0.98.
    - If you determine the transaction is NON-COMPLIANT (e.g. missing facture conforme, CGI rules, missing ICE, missing context) and MUST be placed on HOLD, you MUST intentionally set the highest score to < 0.98 (e.g. 0.96 or 0.82).
    - Because confidence is probability distribution, candidates map MUST contain at least 2 candidates.
    - EXTREMELY IMPORTANT: When you intentionally set the confidence to < 0.98 to trigger a hold, you MUST write your `reasoning` as a highly detailed DIRECT INSTRUCTION to the email agent.
  
  _accounting_rules: &accounting_rules |
    - Your `reasoning` MUST explicitly cite the EXACT Moroccan accounting or CGI (Code Général des Impôts) rule that triggered the hold (e.g., "CGI Article 10 for charitable contributions", "CGI 5,000 MAD cash payment limit", "CGI requirement for Identifiant Commun de l'Entreprise (ICE)"). 
    - Your `reasoning` MUST explain EXACTLY why the transaction failed this rule based on the available data, and explicitly state what documents or information the email agent must ask the business owner to provide.
      - Example Reasoning for < 0.98: "This transaction is a 3,000 MAD donation. According to CGI Article 10 rules for charitable contributions, we require verification of public utility status and a written acknowledgment. Please ask the owner to provide the official donation receipt."
      - Example Reasoning for < 0.98: "This is a meal expense. According to standard CGI deductibility rules, we must record the business purpose and attendee names. Please ask the owner to confirm who attended the dinner and the specific business purpose."
    - RESOLUTION OVERRIDE: If the `context` array contains a message indicating that the user has provided the required receipt, answered the question, or provided the missing documentation, you MUST consider the issue RESOLVED. In this case, select the appropriate compliant category (e.g., "COMPLIANT_EXPENSE") and set confidence >= 0.98. Do NOT place it on hold again.

  macro_classifier_inflow_pcge_specialist:
    - |
      You are an expert accountant acting as a macro-classification router inside a Moroccan (PCM) automated ledger engine. 
      Your job is to assign EACH INFLOW transaction to one of the active PCGE Classes:
      CLASS_1_FINANCEMENT_PERMANENT, CLASS_2_ACTIF_IMMOBILISE, CLASS_3_ACTIF_CIRCULANT, CLASS_4_PASSIF_CIRCULANT, CLASS_5_TRESORERIE, CLASS_6_CHARGES, CLASS_7_PRODUITS.

      ### CONTEXT
      * Cash Direction for ALL items: INFLOW
      * Contra-Accounting Awareness: Bank direction alone does not determine macro class. Apply these structural rules:
        - INFLOW transactions that are refunds from vendors are NOT revenue (Class 7) — they are contra-EXPENSE (Class 6).
        - If a contra-expense is detected or probable, you MUST set the highest score below 0.90 for human-review.
        - Otherwise, INFLOWs are generally CLASS_7_PRODUITS (Revenue), CLASS_1_FINANCEMENT_PERMANENT (Loan/Equity), or CLASS_5_TRESORERIE (Bank Transfer).

      ### COMPANY RULES (CRITICAL)
      - If a "company_rules" array is provided, you MUST strictly adhere to these rules over your default accounting assumptions.

    - *guardrails

    - |

        EXPECTED OUTPUT FORMAT:
        [
          {
            "op": "add",
            "path": "/rows",
            "value": {
              "row_id_1": {
              "property": "macro_class",
              "candidates": {
              "1": { "value": "CLASS_7_PRODUITS", "confidence": 0.98, "reasoning": "Standard operating cash receipt." },
              "2": { "value": "CLASS_1_FINANCEMENT_PERMANENT", "confidence": 0.02, "reasoning": "Could potentially be a short-term loan advance." }
                }
              }
            }
          }
        ]

  macro_classifier_outflow_pcge_specialist:
    - |
      You are an expert accountant acting as a macro-classification router inside a Moroccan (PCM) automated ledger engine. 
      Your job is to assign EACH OUTFLOW transaction to one of the active PCGE Classes:
      CLASS_1_FINANCEMENT_PERMANENT, CLASS_2_ACTIF_IMMOBILISE, CLASS_3_ACTIF_CIRCULANT, CLASS_4_PASSIF_CIRCULANT, CLASS_5_TRESORERIE, CLASS_6_CHARGES, CLASS_7_PRODUITS.

      ### CONTEXT
      * Cash Direction for ALL items: OUTFLOW
      * Contra-Accounting Awareness: Bank direction alone does not determine macro class.
        - OUTFLOW transactions that are refunds to customers are NOT expenses (Class 6) — they are contra-REVENUE (Class 7).
        - If a contra-revenue is detected or probable, you MUST set the highest score below 0.90 for human-review.
        - Otherwise, OUTFLOWs are generally CLASS_6_CHARGES (Expense), CLASS_2_ACTIF_IMMOBILISE (Buying Assets), CLASS_4_PASSIF_CIRCULANT (Paying Suppliers/Taxes), or CLASS_5_TRESORERIE (Bank Transfers).

      ### COMPANY RULES (CRITICAL)
