syntax = "proto3";

package toro;

option go_package = "github.com/Yankzy/usetoro/internal/proto";

// The Toro Protocol service definition.
service Protocol {
  // ProcessEvent sends an event to the Python sidecar.
  rpc ProcessEvent (EventRequest) returns (EventResponse) {}
}

message EventRequest {
  string request_id = 1;
  string event_type = 2;
  bytes payload = 3;
}

message EventResponse {
  bool success = 1;
  string message = 2;
}
