<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toro | The AI-Native Stability Layer</title>

    <!-- Favicon (Toro Logo: Shield + Bull Horns) -->
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3c0 6-7 11-10 11S2 17 2 11V8z' /%3E%3Cpath d='M2 6L5 2' /%3E%3Cpath d='M22 6L19 2' /%3E%3Cline x1='12' y1='11' x2='12' y2='17' /%3E%3Cline x1='9' y1='14' x2='15' y2='14' /%3E%3C/svg%3E">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        toro: {
                            bg: '#050505',
                            card: '#0A0A0A',
                            border: '#27272a', // zinc-800
                            green: '#22c55e',
                            greenDim: 'rgba(34, 197, 94, 0.1)',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                        'grid-flow': 'gridFlow 20s linear infinite',
                        'scan': 'scan 2s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(200%)' }
                        },
                        gridFlow: {
                            '0%': { backgroundPosition: '0 0' },
                            '100%': { backgroundPosition: '40px 40px' }
                        },
                        scan: {
                            '0%': { top: '0%' },
                            '100%': { top: '100%' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: white;
        }

        /* Custom scrollbar for terminal */
        .terminal-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-scroll::-webkit-scrollbar-track {
            background: #0A0A0A;
        }

        .terminal-scroll::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .cursor-blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .grid-bg {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, #18181b 1px, transparent 1px),
                linear-gradient(to bottom, #18181b 1px, transparent 1px);
        }
    </style>
</head>

<body>
    <!-- Hidden form for Netlify Detection (Works if you deploy to Netlify) -->
    <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
        <input type="email" name="email" />
    </form>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Utils ---
        const RevealOnScroll = ({ children, delay = 0, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.disconnect();
                        }
                    },
                    { threshold: 0.1 }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div
                    ref={ref}
                    className={`transition-all duration-1000 ease-out transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        // --- Icons ---
        const Icons = {
            Logo: ({ className }) => (
                <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M2 8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3c0 6-7 11-10 11S2 17 2 11V8z" />
                    <path d="M2 6L5 2" />
                    <path d="M22 6L19 2" />
                    <line x1="12" y1="11" x2="12" y2="17" />
                    <line x1="9" y1="14" x2="15" y2="14" />
                </svg>
            ),
            Shield: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /></svg>,
            Terminal: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 17 10 11 4 5" /><line x1="12" x2="20" y1="19" y2="19" /></svg>,
            Activity: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2" /></svg>,
            Check: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>,
            Zap: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>,
            Server: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2" /><rect width="20" height="8" x="2" y="14" rx="2" ry="2" /><line x1="6" x2="6.01" y1="6" y2="6" /><line x1="6" x2="6.01" y1="18" y2="18" /></svg>,
            ChevronDown: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6" /></svg>,
            RotateCw: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg>,
            Play: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3" /></svg>,
            Brain: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" /><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" /><path d="M15 13a4.5 4.5 0 0 1-3-1.4 4.5 4.5 0 0 1-3 1.4" /></svg>
        };

        // --- Components ---

        const SectionTitle = ({ children, badge }) => (
            <RevealOnScroll className="text-center max-w-2xl mx-auto mb-16">
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-900 border border-toro-border text-xs text-green-400 font-mono mb-6 hover:scale-105 transition-transform cursor-default">
                    {badge}
                </div>
                <h2 className="text-3xl md:text-5xl font-bold tracking-tight mb-4">{children}</h2>
            </RevealOnScroll>
        );

        const WaitlistForm = ({ id }) => {
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);

            // --- INSTRUCTIONS ---
            // Paste your Google Apps Script URL here (it starts with https://script.google.com/macros/s/...)
            const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyJVlAXnOsvYkarrZ9oWV5yEHpn0SgmSap2D5WvWyYEG6UkbrNG1DptpLqHDtlhKL1_PA/exec";

            // Specify which Tab (at the bottom of your Google Sheet) to write to
            const TAB_NAME = "Sheet1";

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!email) return;

                setLoading(true);

                try {
                    if (WEBHOOK_URL) {
                        await fetch(WEBHOOK_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ email, sheetName: TAB_NAME })
                        });
                    } else {
                        await new Promise(resolve => setTimeout(resolve, 800));
                    }
                    setSubmitted(true);
                    setEmail('');
                } catch (error) {
                    console.error("Error:", error);
                    setSubmitted(true);
                    setEmail('');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-3 max-w-md w-full relative z-20" name="waitlist">
                    <input
                        type="email"
                        name="email"
                        placeholder="developer@startup.com"
                        className="bg-zinc-900/50 border border-toro-border rounded-lg px-4 py-3 flex-1 focus:outline-none focus:border-green-500 transition-colors placeholder:text-zinc-600 text-white"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        required
                        disabled={submitted || loading}
                    />
                    <button
                        type="submit"
                        className={`font-semibold px-6 py-3 rounded-lg transition-all flex items-center justify-center gap-2 min-w-[140px] 
                            ${submitted ? 'bg-green-600 text-white' : 'bg-white text-black hover:bg-zinc-200 hover:scale-105'}
                            ${loading ? 'opacity-80 cursor-wait' : ''}
                        `}
                        disabled={submitted || loading}
                    >
                        {loading ? "Joining..." : (submitted ? <><Icons.Check className="w-4 h-4" /> Joined</> : "Join Waitlist")}
                    </button>
                </form>
            );
        };

        const ArchitectureRow = ({ title, source, dest, toroAction, icon: Icon, delay = 0 }) => (
            <RevealOnScroll delay={delay} className="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-8 opacity-90 mb-12 last:mb-0 relative">
                <div className="md:absolute left-0 md:left-4 xl:left-24 text-xs font-mono text-zinc-600 uppercase tracking-widest mb-2 md:mb-0 w-full md:w-auto text-center md:text-left">{title}</div>

                {/* Source */}
                <div className="p-5 border border-zinc-800 rounded-xl bg-zinc-900/50 w-64 text-center z-10 shadow-lg">
                    <div className="font-mono text-zinc-500 text-[10px] mb-2 uppercase">Source</div>
                    <div className="font-bold text-sm text-zinc-200">{source}</div>
                </div>

                {/* Animated Line 1 */}
                <div className="hidden md:block w-16 h-px bg-zinc-800 relative overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-r from-transparent via-green-500 to-transparent w-1/2 animate-shimmer"></div>
                </div>
                <div className="md:hidden w-px h-12 bg-zinc-800 relative overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-b from-transparent via-green-500 to-transparent h-1/2 animate-shimmer"></div>
                </div>

                {/* Toro */}
                <div className="p-4 border border-green-500/30 rounded-xl bg-green-500/5 w-64 relative z-10 hover:scale-105 transition-transform duration-300 group flex flex-col items-center gap-2 shadow-[0_0_20px_rgba(34,197,94,0.1)]">
                    <div className="absolute -top-3 bg-[#030303] border border-green-500/30 rounded-full p-1 shadow-[0_0_15px_rgba(34,197,94,0.3)]">
                        <Icon className="w-5 h-5 text-green-500" />
                    </div>
                    <div className="pt-2 font-mono text-sm text-green-400 font-bold">{toroAction}</div>
                    <div className="text-[10px] text-zinc-500 font-mono">Processing...</div>
                </div>

                {/* Animated Line 2 */}
                <div className="hidden md:block w-16 h-px bg-zinc-800 relative overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-r from-transparent via-green-500 to-transparent w-1/2 animate-shimmer" style={{ animationDelay: '0.5s' }}></div>
                </div>
                <div className="md:hidden w-px h-12 bg-zinc-800 relative overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-b from-transparent via-green-500 to-transparent h-1/2 animate-shimmer" style={{ animationDelay: '0.5s' }}></div>
                </div>

                {/* Dest */}
                <div className="p-5 border border-zinc-800 rounded-xl bg-zinc-900/50 w-64 text-center z-10 shadow-lg">
                    <div className="font-mono text-zinc-500 text-[10px] mb-2 uppercase">Destination</div>
                    <div className="font-bold text-sm text-zinc-200">{dest}</div>
                </div>
            </RevealOnScroll>
        );

        // --- Dashboard Demo Component (AI Enhanced) ---
        const DashboardDemo = () => {
            const [rows, setRows] = useState([
                { id: 1, method: "POST", path: "/twilio/sms-inbound", status: 200, time: "2s ago" },
                { id: 2, method: "POST", path: "/stripe/payment_intent", status: 500, time: "12s ago", failed: true },
                { id: 3, method: "POST", path: "/plaid/transactions/sync", status: 200, time: "45s ago" },
            ]);
            const [replaying, setReplaying] = useState(false);
            const [analyzing, setAnalyzing] = useState(true);

            useEffect(() => {
                const diverseEvents = [
                    { path: "/slack/events", method: "POST", fix: "Schema Mismatch: 'user_id' string vs int." },
                    { path: "/zendesk/tickets", method: "POST", fix: "Validation: 'priority' field is missing." },
                    { path: "/shopify/orders", method: "POST", fix: "Timeout: Downstream DB connection lost." }
                ];
                let eventIndex = 0;

                const interval = setInterval(() => {
                    setReplaying(true);
                    setAnalyzing(false); // Reset analysis UI during replay

                    setTimeout(() => {
                        const nextEvent = diverseEvents[eventIndex];
                        eventIndex = (eventIndex + 1) % diverseEvents.length;

                        setRows(prev => [
                            {
                                id: Date.now(),
                                method: nextEvent.method,
                                path: nextEvent.path,
                                status: 200,
                                time: "Just now",
                                replayed: true
                            },
                            prev[1],
                            prev[2]
                        ]);
                        setReplaying(false);
                        // Start analysis for the static failed row again after "fix"
                        setTimeout(() => setAnalyzing(true), 500);
                    }, 1000);
                }, 5000);

                return () => clearInterval(interval);
            }, []);

            return (
                <div className="bg-[#0A0A0A] border border-toro-border rounded-xl shadow-2xl overflow-hidden font-mono text-xs md:text-sm relative transition-all duration-300">
                    <div className="flex items-center justify-between px-4 py-3 bg-zinc-900/50 border-b border-toro-border">
                        <div className="flex gap-4 text-zinc-500 font-bold text-[10px] tracking-wider uppercase">
                            <span className="w-16">Method</span>
                            <span className="flex-1">Endpoint</span>
                            <span className="w-20">Status</span>
                            <span className="w-16">Action</span>
                        </div>
                    </div>
                    <div className="p-2 space-y-1">
                        {rows.map((row, i) => (
                            <div key={row.id}>
                                <div className={`flex items-center gap-4 px-3 py-2 rounded transition-all duration-500 ${row.replayed ? 'bg-green-900/10 border border-green-900/30' : 'hover:bg-zinc-900/40'}`}>
                                    <span className={`w-16 font-bold ${row.method === 'POST' ? 'text-blue-400' : 'text-purple-400'}`}>{row.method}</span>
                                    <span className="flex-1 text-zinc-300 truncate" title={row.path}>{row.path}</span>
                                    <span className={`w-20 font-bold ${row.status === 200 ? 'text-green-500' : 'text-red-500'}`}>
                                        {row.status === 500 ? "500 ERR" : "200 OK"}
                                    </span>
                                    <div className="w-16 flex justify-end relative">
                                        {row.failed && (
                                            <button className={`p-1.5 rounded bg-zinc-800 text-zinc-400 hover:text-white hover:bg-zinc-700 transition-colors ${replaying ? 'text-green-400' : ''}`}>
                                                <Icons.RotateCw className={`w-3 h-3 ${replaying ? 'animate-spin' : ''}`} />
                                            </button>
                                        )}
                                        {row.failed && replaying && (
                                            <div className="absolute -bottom-4 -right-4 transition-transform duration-500 z-50">
                                                <svg className="w-6 h-6 text-white drop-shadow-lg" fill="currentColor" viewBox="0 0 24 24"><path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2.9-3.2-7.4-4.4 4z" /></svg>
                                            </div>
                                        )}
                                    </div>
                                </div>
                                {/* AI Analysis Drawer */}
                                {row.failed && analyzing && !replaying && (
                                    <div className="ml-12 mr-4 mt-1 mb-2 p-3 bg-zinc-900/80 border border-toro-border rounded-lg animate-[slideDown_0.3s_ease-out] relative overflow-hidden">
                                        <div className="absolute inset-0 bg-green-500/5 animate-pulse-slow"></div>
                                        <div className="flex gap-3 relative z-10">
                                            <Icons.Brain className="w-4 h-4 text-purple-400 mt-0.5" />
                                            <div>
                                                <div className="text-[10px] font-bold text-purple-400 mb-1 uppercase tracking-wider">AI Diagnostics</div>
                                                <div className="text-zinc-300">Crash Reason: Field <span className="text-white font-bold">'amount'</span> is null, but schema expects <span className="text-white font-bold">Integer</span>.</div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        function App() {
            const [logs, setLogs] = useState([
                { id: 1, text: "➜ ~ toro listen --port 3000", color: "text-zinc-300", delay: 0 },
                { id: 2, text: "Authenticated as @cachecowboy", color: "text-zinc-500", delay: 800 },
                { id: 3, text: "✔ Tunnel Established: https://api.usetoro.io/h/8291", color: "text-green-500", delay: 1600 },
                { id: 4, isDivider: true, delay: 1600 },
            ]);

            const [dynamicLogs, setDynamicLogs] = useState([]);

            useEffect(() => {
                const traffic = [
                    { time: "[20:01:42]", method: "POST", path: "/stripe/webhook", status: "200 OK", statusColor: "text-green-500", latency: "(12ms)" },
                    { time: "[20:01:45]", method: "POST", path: "/supabase/write", status: "QUEUED", statusColor: "text-yellow-500", latency: "(Buffered)" },
                    { time: "[20:01:46]", method: "POST", path: "/plaid/sync", status: "PROCESSING", statusColor: "text-blue-400", latency: "..." },
                ];

                let timeouts = [];
                traffic.forEach((log, index) => {
                    const timeout = setTimeout(() => {
                        setDynamicLogs(prev => [...prev, log]);
                    }, 2500 + (index * 1200));
                    timeouts.push(timeout);
                });
                return () => timeouts.forEach(clearTimeout);
            }, []);

            return (
                <div className="min-h-screen text-white font-sans selection:bg-green-500/30 overflow-x-hidden">

                    {/* --- Navbar --- */}
                    <nav className="fixed top-0 w-full z-50 bg-[#050505]/80 backdrop-blur-md border-b border-toro-border">
                        <div className="flex items-center justify-between px-6 py-4 max-w-7xl mx-auto">
                            <div className="flex items-center gap-2 font-mono text-xl font-bold tracking-tighter cursor-pointer hover:opacity-80 transition-opacity" onClick={() => window.scrollTo(0, 0)}>
                                <Icons.Logo className="w-8 h-8 text-green-500" />
                                <span className="pt-1">TORO</span>
                            </div>
                            <div className="hidden md:flex gap-8 text-sm font-medium text-zinc-400">
                                <a href="#problem" className="hover:text-white transition-colors">The Trap</a>
                                <a href="#features" className="hover:text-white transition-colors">Features</a>
                                <a href="#pricing" className="hover:text-white transition-colors">Pricing</a>
                                <a href="#faq" className="hover:text-white transition-colors">FAQ</a>
                            </div>
                            <a href="#join" className="text-sm bg-zinc-900 hover:bg-zinc-800 text-white px-4 py-2 rounded-lg border border-toro-border transition-colors">
                                Login
                            </a>
                        </div>
                    </nav>

                    {/* --- Hero Section --- */}
                    <main className="max-w-7xl mx-auto px-6 pt-32 pb-24 relative">
                        {/* Background Grid with Animation */}
                        <div className="absolute inset-0 grid-bg opacity-[0.15] -z-10 pointer-events-none mask-gradient animate-grid-flow"></div>

                        <div className="grid lg:grid-cols-2 gap-16 items-center">
                            <RevealOnScroll className="space-y-8 z-10">
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-900 border border-toro-border text-xs text-zinc-400 font-mono">
                                    <span className="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                                    v1.0 Early Access
                                </div>
                                <h1 className="text-5xl md:text-7xl font-bold tracking-tight leading-[1.1]">
                                    The <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">AI-Native</span> Stability Layer for Vibe Coders.
                                </h1>
                                <p className="text-xl text-zinc-400 max-w-md leading-relaxed">
                                    Stop crashing Supabase with AI agents. Stop fighting Plaid webhooks.
                                    Toro provides the queues, tunnels, and workers so you can just build.
                                </p>
                                <WaitlistForm id="hero-form" />
