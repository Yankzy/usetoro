[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
keywords = ["django", "finance", "bookkeeping", "accounting", "balance sheet", "income statement", "general ledger", "money", "engine"]
name = "ledger"
version = "1.0.0"
description = "The fignode Backend ledger module."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yankz", email = "yankz@fignode.com" }]
dependencies = [
    "asgiref>=3.5.2; python_version >= '3.7'",
    "django-treebeard>=4.5.1",
    "ofxtools>=0.9.5",
    "python-dateutil>=2.8.2; python_version >= '2.7' and python_version not in '3.0, 3.1, 3.2, 3.3'",
    "six>=1.16.0; python_version >= '2.7' and python_version not in '3.0, 3.1, 3.2, 3.3'",
    "sqlparse>=0.4.3; python_version >= '3.5'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests"]
namespaces = false

[tool.pyright]
extraPaths = [".", "..", "bookkeeping_state", "bookkeeping_state_eval", "../ledger"]
