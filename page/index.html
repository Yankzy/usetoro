<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toro | Financial Concierge + Intelligence Platform</title>

    <!-- Favicon (Toro Logo: Shield + Bull Horns) -->
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3c0 6-7 11-10 11S2 17 2 11V8z' /%3E%3Cpath d='M2 6L5 2' /%3E%3Cpath d='M22 6L19 2' /%3E%3Cline x1='12' y1='11' x2='12' y2='17' /%3E%3Cline x1='9' y1='14' x2='15' y2='14' /%3E%3C/svg%3E">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        toro: {
                            bg: '#050505',
                            card: '#0A0A0A',
                            border: '#27272a', // zinc-800
                            green: '#22c55e',
                            greenDim: 'rgba(34, 197, 94, 0.1)',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                        'shimmer-vertical': 'shimmerVertical 2s linear infinite',
                        'grid-flow': 'gridFlow 20s linear infinite',
                        'scan': 'scan 2s linear infinite',
                        'scroll-left': 'scroll 30s linear infinite',
                    },
                    keyframes: {
                        scroll: {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(200%)' }
                        },
                        shimmerVertical: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(200%)' }
                        },
                        gridFlow: {
                            '0%': { backgroundPosition: '0 0' },
                            '100%': { backgroundPosition: '40px 40px' }
                        },
                        scan: {
                            '0%': { top: '0%' },
                            '100%': { top: '100%' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: white;
            overflow-x: hidden;
        }

        /* Custom scrollbar for terminal */
        .terminal-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-scroll::-webkit-scrollbar-track {
            background: #0A0A0A;
        }

        .terminal-scroll::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .cursor-blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .grid-bg {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, #18181b 1px, transparent 1px),
                linear-gradient(to bottom, #18181b 1px, transparent 1px);
        }

        .mask-gradient-x {
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
    </style>
</head>

<body>
    <!-- Hidden form for Netlify Detection (Works if you deploy to Netlify) -->
    <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
        <input type="email" name="email" />
    </form>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Utils ---
        const RevealOnScroll = ({ children, delay = 0, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.disconnect();
                        }
                    },
                    { threshold: 0.1 }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div
                    ref={ref}
                    className={`transition-all duration-1000 ease-out transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        // --- Icons ---
        const Icons = {
            Logo: ({ className }) => (
                <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M2 8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3c0 6-7 11-10 11S2 17 2 11V8z" />
                    <path d="M2 6L5 2" />
                    <path d="M22 6L19 2" />
                    <line x1="12" y1="11" x2="12" y2="17" />
                    <line x1="9" y1="14" x2="15" y2="14" />
                </svg>
            ),
            Shield: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /></svg>,
            Terminal: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 17 10 11 4 5" /><line x1="12" x2="20" y1="19" y2="19" /></svg>,
            Activity: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2" /></svg>,
            Check: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>,
            Zap: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>,
            Server: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2" /><rect width="20" height="8" x="2" y="14" rx="2" ry="2" /><line x1="6" x2="6.01" y1="6" y2="6" /><line x1="6" x2="6.01" y1="18" y2="18" /></svg>,
            ChevronDown: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6" /></svg>,
            RotateCw: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg>,
            Play: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3" /></svg>,
            Brain: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" /><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" /><path d="M15 13a4.5 4.5 0 0 1-3-1.4 4.5 4.5 0 0 1-3 1.4" /></svg>,
            FileText: ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></svg>
        };

        // --- Components ---

        const SectionTitle = ({ children, badge }) => (
            <RevealOnScroll className="text-center max-w-2xl mx-auto mb-16">
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-900 border border-toro-border text-xs text-green-400 font-mono mb-6 hover:scale-105 transition-transform cursor-default">
                    {badge}
                </div>
                <h2 className="text-3xl md:text-5xl font-bold tracking-tight mb-4">{children}</h2>
            </RevealOnScroll>
        );

        const WaitlistForm = ({ id }) => {
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);

            // --- INSTRUCTIONS ---
            // Paste your Google Apps Script URL here (it starts with https://script.google.com/macros/s/...)
            const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyJVlAXnOsvYkarrZ9oWV5yEHpn0SgmSap2D5WvWyYEG6UkbrNG1DptpLqHDtlhKL1_PA/exec";

            // Specify which Tab (at the bottom of your Google Sheet) to write to
            const TAB_NAME = "Sheet1";

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!email) return;

                setLoading(true);

                try {
                    if (WEBHOOK_URL) {
                        await fetch(WEBHOOK_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ email, sheetName: TAB_NAME })
                        });
                    } else {
                        await new Promise(resolve => setTimeout(resolve, 800));
                    }
                    setSubmitted(true);
                    setEmail('');
                } catch (error) {
                    console.error("Error:", error);
                    setSubmitted(true);
                    setEmail('');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-3 max-w-md w-full relative z-20" name="waitlist">
                    <input
                        type="email"
                        name="email"
                        placeholder="developer@startup.com"
                        className="bg-zinc-900/50 border border-toro-border rounded-lg px-4 py-3 flex-1 focus:outline-none focus:border-green-500 transition-colors placeholder:text-zinc-600 text-white"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        required
                        disabled={submitted || loading}
                    />
                    <button
                        type="submit"
                        className={`font-semibold px-6 py-3 rounded-lg transition-all flex items-center justify-center gap-2 min-w-[140px] 
                            ${submitted ? 'bg-green-600 text-white' : 'bg-white text-black hover:bg-zinc-200 hover:scale-105'}
                            ${loading ? 'opacity-80 cursor-wait' : ''}
                        `}
                        disabled={submitted || loading}
                    >
                        {loading ? "Joining..." : (submitted ? <><Icons.Check className="w-4 h-4" /> Joined</> : "Join Waitlist")}
                    </button>
                </form>
            );
        };

        const SalesContactModal = (props) => {
            const { isOpen, onClose } = props;
            if (!isOpen) return null;

            const [formData, setFormData] = useState({ name: '', email: '', company: '', reason: '' });
            const [status, setStatus] = useState('idle'); // idle, loading, success, error

            // --- INSTRUCTIONS ---
            // Sent to Sheet2
            const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyJVlAXnOsvYkarrZ9oWV5yEHpn0SgmSap2D5WvWyYEG6UkbrNG1DptpLqHDtlhKL1_PA/exec";
            const TAB_NAME = "Sheet2";

            const handleSubmit = async (e) => {
                e.preventDefault();
                setStatus('loading');

                try {
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ ...formData, tier: props.tier, price: props.price, sheetName: TAB_NAME })
                    });
                    setStatus('success');
                    setTimeout(() => {
                        onClose();
                        setStatus('idle');
                        setFormData({ name: '', email: '', company: '', reason: '' });
                    }, 2000);
                } catch (error) {
                    console.error(error);
                    setStatus('error');
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative bg-[#0A0A0A] border border-toro-border rounded-xl w-full max-w-lg p-6 shadow-2xl animate-[scaleIn_0.2s_ease-out]">
                        <button onClick={onClose} className="absolute top-4 right-4 text-zinc-500 hover:text-white transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>

                        {status === 'success' ? (
                            <div className="text-center py-12">
                                <div className="w-16 h-16 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <Icons.Check className="w-8 h-8 text-green-500" />
                                </div>
                                <h3 className="text-xl font-bold mb-2">Message Sent</h3>
                                <p className="text-zinc-400">We'll be in touch shortly.</p>
                            </div>
                        ) : (
                            <>
                                <h3 className="text-xl font-bold mb-1">Contact Sales</h3>
                                <p className="text-zinc-500 text-sm mb-6">Tell us about your requirements.</p>

                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-mono text-zinc-500 mb-1.5 uppercase">Name</label>
                                        <input
                                            required
                                            type="text"
                                            className="w-full bg-zinc-900/50 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-green-500 transition-colors"
                                            value={formData.name}
                                            onChange={e => setFormData({ ...formData, name: e.target.value })}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-mono text-zinc-500 mb-1.5 uppercase">Work Email</label>
                                        <input
                                            required
                                            type="email"
                                            className="w-full bg-zinc-900/50 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-green-500 transition-colors"
                                            value={formData.email}
                                            onChange={e => setFormData({ ...formData, email: e.target.value })}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-mono text-zinc-500 mb-1.5 uppercase">Company</label>
                                        <input
                                            required
                                            type="text"
                                            className="w-full bg-zinc-900/50 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-green-500 transition-colors"
                                            value={formData.company}
                                            onChange={e => setFormData({ ...formData, company: e.target.value })}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-mono text-zinc-500 mb-1.5 uppercase">Describe your problem</label>
                                        <textarea
                                            required
                                            rows="3"
                                            className="w-full bg-zinc-900/50 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-green-500 transition-colors resize-none"
                                            value={formData.reason}
                                            onChange={e => setFormData({ ...formData, reason: e.target.value })}
                                        ></textarea>
                                    </div>
                                    <button
                                        type="submit"
                                        disabled={status === 'loading'}
                                        className="w-full bg-white text-black font-semibold py-3 rounded-lg hover:bg-gray-200 transition-colors disabled:opacity-50 mt-2"
                                    >
                                        {status === 'loading' ? 'Sending...' : 'Send Request'}
                                    </button>
                                </form>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const ArchitectureRow = ({ title, source, dest, toroAction, icon: Icon, delay = 0 }) => (
            <RevealOnScroll delay={delay} className="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-8 opacity-90 mb-12 last:mb-0 relative">
                <div className="md:absolute left-0 md:left-4 xl:left-24 text-xs font-mono text-zinc-600 uppercase tracking-widest mb-2 md:mb-0 w-full md:w-auto text-center md:text-left">{title}</div>

                {/* Source */}
                <div className="p-5 border border-zinc-800 rounded-xl bg-zinc-900/50 w-64 text-center z-10 shadow-lg">
                    <div className="font-mono text-zinc-500 text-[10px] mb-2 uppercase">Source</div>
                    <div className="font-bold text-sm text-zinc-200">{source}</div>
                </div>

                {/* Animated Line 1 */}
                <div className="hidden md:block w-16 h-px bg-zinc-800 relative overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-r from-transparent via-green-500 to-transparent w-1/2 animate-shimmer"></div>
                </div>
                <div className="md:hidden w-px h-12 bg-zinc-800 relative overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-b from-transparent via-green-500 to-transparent h-1/2 animate-shimmer-vertical"></div>
                </div>

                {/* Toro */}
                <div className="p-4 border border-green-500/30 rounded-xl bg-green-500/5 w-64 relative z-10 hover:scale-105 transition-transform duration-300 group flex flex-col items-center gap-2 shadow-[0_0_20px_rgba(34,197,94,0.1)]">
                    <div className="absolute -top-3 bg-[#030303] border border-green-500/30 rounded-full p-1 shadow-[0_0_15px_rgba(34,197,94,0.3)]">
                        <Icon className="w-5 h-5 text-green-500" />
                    </div>
                    <div className="pt-2 font-mono text-sm text-green-400 font-bold">{toroAction}</div>
                    <div className="text-[10px] text-zinc-500 font-mono">Processing...</div>
                </div>

                {/* Animated Line 2 */}
                <div className="hidden md:block w-16 h-px bg-zinc-800 relative overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-r from-transparent via-green-500 to-transparent w-1/2 animate-shimmer" style={{ animationDelay: '0.5s' }}></div>
                </div>
                <div className="md:hidden w-px h-12 bg-zinc-800 relative overflow-hidden">
                    <div className="absolute inset-0 bg-gradient-to-b from-transparent via-green-500 to-transparent h-1/2 animate-shimmer-vertical" style={{ animationDelay: '0.5s' }}></div>
                </div>

                {/* Dest */}
                <div className="p-5 border border-zinc-800 rounded-xl bg-zinc-900/50 w-64 text-center z-10 shadow-lg">
                    <div className="font-mono text-zinc-500 text-[10px] mb-2 uppercase">Destination</div>
                    <div className="font-bold text-sm text-zinc-200">{dest}</div>
                </div>
            </RevealOnScroll>
        );

        // --- Testimonials Carousel Component ---
        const TestimonialsCarousel = () => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isAutoPlaying, setIsAutoPlaying] = useState(true);

            const testimonials = [
                {
                    id: 1,
                    name: "Sarah Chen",
                    role: "Engineering Lead",
                    company: "Fintech Startup",
                    image: "./assets/avatar_1.png",
                    quote: "Toro eliminated 3 weeks of integration work. We went from debugging Stripe webhooks at 2AM to having bulletproof financial data pipelines.",
                    verified: true
                },
                {
                    id: 2,
                    name: "David Miller",
                    role: "CTO",
                    company: "TechFlow",
                    image: "./assets/avatar_2.png",
                    quote: "No more schema drift nightmares. Toro handles all our Plaid integrations flawlessly. The peace of mind alone is worth every penny.",
                    verified: true
                },
                {
                    id: 3,
                    name: "Maya Johnson",
                    role: "Product Manager",
                    company: "Creative Solutions",
                    image: "./assets/avatar_3.png",
                    quote: "We needed SOC-2 compliance and cross-provider reconciliation. Toro delivered both without us writing a single line of integration code.",
                    verified: true
                },
                {
                    id: 4,
                    name: "Arjun Patel",
                    role: "Senior Developer",
                    company: "DevCorp",
                    image: "./assets/avatar_4.png",
                    quote: "QuickBooks token management was killing our velocity. Toro made it disappear completely. Now we ship features instead of maintaining integrations.",
                    verified: true
                },
                {
                    id: 5,
                    name: "Elena Ross",
                    role: "VP of Engineering",
                    company: "Global Systems",
                    image: "./assets/avatar_5.png",
                    quote: "The AI diagnostics for failed webhooks is pure magic. Saved us hours of debugging. It's like having a senior engineer on call 24/7.",
                    verified: true
                },
                {
                    id: 6,
                    name: "Carlos Gomez",
                    role: "Lead Designer",
                    company: "Artistry Inc.",
                    image: "./assets/avatar_6.png",
                    quote: "Implementation was surprisingly smooth. The documentation is top-notch and the support team is incredibly responsive.",
                    verified: true
                },
                {
                    id: 7,
                    name: "Zara Al-Fayed",
                    role: "Data Scientist",
                    company: "DataMinds",
                    image: "./assets/avatar_7.png",
                    quote: "Finally, a unified financial data layer that actually works. The normalization across different providers is spot on.",
                    verified: true
                },
                {
                    id: 8,
                    name: "Robert Washington",
                    role: "VP of Technology",
                    company: "Enterprise Co.",
                    image: "./assets/avatar_8.png",
                    quote: "We replaced our entire home-grown billing infrastructure with Toro. It's more reliable, faster, and significantly cheaper.",
                    verified: true
                },
                {
