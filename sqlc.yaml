version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        package: "database"
        out: "go/internal/database"
        sql_package: "pgx/v5"
  - schema: "sql/schema"
    queries: "sql/queries/agent_memory.sql"
    engine: "postgresql"
    gen:
      go:
        package: "database"
        out: "tap/internal/database"
        sql_package: "pgx/v5"
