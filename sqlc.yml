version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        package: "database"
        out: "go/internal/database"
        sql_package: "pgx/v5"
        emit_interface: true
        overrides:
          - db_type: "vector"
            go_type: "string"
            nullable: false
          - column: "toro_core.ase_vector_memory.embedding"
            go_type: "string"
  - schema: "sql/schema"
    queries: "sql/queries/agent_memory.sql"
    engine: "postgresql"
    gen:
      go:
        package: "database"
        out: "tap/internal/database"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "vector"
            go_type: "string"
            nullable: false
          - column: "toro_core.ase_vector_memory.embedding"
            go_type: "string"
