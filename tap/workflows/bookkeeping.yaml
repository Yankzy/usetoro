name: Bookkeeping Workflow
version: "1.0"
trigger_topic: events.accounting.1.bookkeeping
steps:
  - id: run_cleanup
    sub_workflow: "CSV Cleaner Pipeline"
    negotiate: false
    timeout: "300s"
    description: "Runs the CSV cleanup and enrichment pipeline as a sub-workflow. When it completes the orchestrator automatically continues this DAG."

  - id: bootstrap_rule_engine
    activity_type: workers.rule_bootstrap
    negotiate: false
    timeout: "300s"
    description: "Bootstraps the rule engine so historical vendor rules are seeded before the bookkeeping steps run."
    depends_on:
      - run_cleanup
    workflow_schema: |
      {
        "type": "object",
        "properties": {
          "realm_id": { "type": "string" }
        },
        "required": ["realm_id"]
      }

  - id: run_rule_engine
    activity_type: workers.rule_evaluation
    negotiate: false
    timeout: "300s"
    description: "Evaluates transactions against the rule engine to automatically approve or categorize based on historical patterns."
    depends_on:
      - bootstrap_rule_engine
    workflow_schema: |
      {
        "type": "object",
        "properties": {
          "session_id": { "type": "string" }
        },
        "required": ["session_id"]
      }
  
  - id: batch_categorize_transactions
    activity_type: workers.delegator
    depends_on:
      - run_rule_engine
    timeout: "600s"
    description: "Chunks the rows array from the rule engine proof into batches of 50 and spawns parallel sub-workflows for AI categorization."
    workflow_schema: |
      {
        "type": "object",
        "properties": {
          "session_id": { "type": "string" }
        }
      }
    config:
      batch_size: 50
      target_sub_workflow: "Categorize Batch Workflow"

  - id: human_review
    activity_type: hitl.review
    depends_on:
      - batch_categorize_transactions
    timeout: "86400s"
    config:
      scope: "session"
      prompt: "Review categorizations before posting to Ledger."
      allow_edits: true
      reject_action: "abort"

  - id: sync_to_qbo
    activity_type: workers.qbo_sync
    depends_on: [human_review]
