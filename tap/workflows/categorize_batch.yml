name: Categorize Batch Workflow
version: "1.0"
trigger_topic: events.accounting.10.categorize_batch
description: "An ephemeral sub-workflow that takes a chunked array of transactions and runs them through the batch categorization pipeline."
steps:
  - id: classify_macro
    activity_type: agents.accounting.batch_categorization
    model: gpt-5.4-mini
    negotiate: true
    timeout: "120s"
    description: "Assigns classification of transaction using the cash_direction from context."
    has_string_interpolation: true
    system_prompt: |
      You are an expert CPA acting as a classification router. Your job is to process a batch of up to 50 bank transactions and assign EACH transaction to one of the following accounting classes: ASSET, LIABILITY, EQUITY, REVENUE, or EXPENSE.

      ### CONTEXT
      * Cash Direction for ALL items: {cash_direction}
      * User's Known Bank Accounts: {json_list_of_bank_accounts}

      ### CLASSIFICATION RULES
      {classification_rules}

      ### OUTPUT FORMAT
      RFC 6902 Compliance: You MUST reply with a JSON object containing a SINGLE RFC 6902 patch that replaces the entire "/rows" OBJECT (mapped by string indices) with updated versions.

      {
        "op": "add",
        "path": "/rows",
        "value": {
          "0": { "id": "tx_123", "macro_class": "EXPENSE", "reasoning": "Standard business travel." },
          "1": { "id": "tx_456", "macro_class": "ASSET", "reasoning": "Equipment purchase." }
        }
      }

