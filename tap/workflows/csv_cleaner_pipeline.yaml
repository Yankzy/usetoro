name: CSV Cleaner Pipeline
version: "1.0"
trigger_topic: events.accounting.*.cleanup
steps:
  - id: map_columns
    activity_type: agents.accounting.map_csv
    complexity: 1
    negotiate: true                                # Allow 3rd party bids via PROPOSE
    timeout: "60s"
    description: "Takes raw rows, maps CSV headers to canonical struct, filters invalid rows."
    workflow_schema: |
      {
        "type": "object",
        "properties": {
          "status": { "type": "string" },
          "mapped_rows": { "type": "object" }
        },
        "required": ["status", "mapped_rows"]
      }

  - id: ambiguity_switch
    activity_type: workers.switch
    complexity: 1
    negotiate: false
    timeout: "10s"
    description: "Routes based on the ambiguous detection from the mapping step."
    depends_on:
      - map_columns
    config:
      nodeMode: sender
      mode: rules
      dataType: boolean
      value1Path: "dependencies.map_columns.data.is_ambiguous"
      rules:
        - operation: equal
          value2: true
          output: 1
        - operation: equal
          value2: false
          output: 0
      fallbackOutput: -1
    suspend_routes:
      - 1
    suspension_reason_path: "dependencies.map_columns.data.ambiguity_reason"

  - id: commit_mapped_columns
    activity_type: workers.database.insert_rows
    negotiate: false
    timeout: "10s"
    description: "Inserts the mapped rows into Postgres DB as PENDING."
    depends_on:
      - ambiguity_switch
    route_condition:
      step_id: ambiguity_switch
      values: [0]

  - id: run_enrichment
    activity_type: workers.database.enrich_rows
    negotiate: false
    timeout: "120s"
    description: "Legacy enrichment step that maps strings to DB entities, outputs ENRICHED events."
    depends_on:
      - commit_mapped_columns

  - id: reconcile_revenue
    activity_type: agents.accounting.reconcile_revenue
    complexity: 1
    negotiate: true
    timeout: "60s"
    description: "Filters positive entries and assigns Customers/Accounts via spatial resolution."
    depends_on:
      - run_enrichment

  - id: reconcile_expense
    activity_type: agents.accounting.reconcile_expense
    complexity: 1
    negotiate: true
    timeout: "60s"
    description: "Filters negative entries and assigns Vendors/Accounts via spatial resolution."
    depends_on:
      - run_enrichment
