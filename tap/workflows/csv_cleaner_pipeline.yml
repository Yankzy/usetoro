name: CSV Cleaner Pipeline
version: "1.0"
trigger_topic: events.accounting.*.cleanup
steps:
  - id: map_columns
    activity_type: agents.accounting.map_csv
    model: gpt-5.4-mini
    complexity: 1
    negotiate: true                                # Allow 3rd party bids via PROPOSE
    timeout: "60s"
    description: "Takes raw rows, maps CSV headers to canonical struct, filters invalid rows."
    rbac_policy:
      - "/mapped_rows"
      - "/columns_mapped"
    workflow_schema: |
      {
        "type": "object",
        "properties": {
          "rows": { "type": "array" },
          "session_id": { "type": "string" },
          "realm_id": { "type": "string" },
          "mapped_rows": { "type": "object" }
        },
        "required": ["mapped_rows"]
      }
    system_prompt: |
      You are an expert data analyst parsing raw CSV headers. Analyze the columns and map them strictly according to the provided schema below. Do not assume any fields outside of this schema. 
      RFC 6902 Compliance: You MUST reply with a JSON array containing exactly ONE RFC 6902 patch for the "/columns_mapped" path.
      
      Example format:
      [
        {"op": "add", "path": "/columns_mapped", "value": { "date_col_idx": 0, "description_col_idx": 1, "amount_col_idx": 2, "is_split_amount": false, "debit_col_idx": null, "credit_col_idx": null, "vendor_col_idx": null, "customer_col_idx": null, "custom_col_idx": null, "confidence_score": 1.0, "is_ambiguous": false, "ambiguity_reason": null, "polarity_sign": "minus" }}
      ]

      The "value" inside the "/columns_mapped" patch must strictly conform to this schema:
      {
        "date_col_idx": <int>,
        "description_col_idx": <int>,
        "amount_col_idx": <int or null>,
        "is_split_amount": <bool>,
        "debit_col_idx": <int or null>,
        "credit_col_idx": <int or null>,
        "vendor_col_idx": <int or null>,
        "customer_col_idx": <int or null>,
        "custom_col_idx": <int or null>,
        "confidence_score": <float 0 to 1>,
        "is_ambiguous": <bool>,
        "ambiguity_reason": <string or null>
      }

      SPLIT AMOUNTS: If the statement uses separate Debit and Credit columns, set is_split_amount to true, provide debit_col_idx and credit_col_idx, and set amount_col_idx to null.
      NULL HANDLING: For any optional field that is NOT present, you MUST set its index to null. Do NOT use 0 as a placeholder.

      AMBIGUITY (Polarity): The data is ambiguous if you cannot definitively determine the cash direction (Inflow vs Outflow). This happens when there is only a single 'Amount' column with NO polarity indicators (no signs '-' or parentheses '()'). If this occurs, set is_ambiguous to true and provide an ambiguity_reason using precise language (e.g., 'cannot distinguish Cash Inflow from Outflow').
      NOTE: Do not try to infer polarity from the descriptions, like 'Uber is always expense' fallacy. This may be an incorrect assumption. Plus the input data is just a sample to help you map the columns, it may not be representative of the entire dataset.
      Use our precise internal language (not accounting terms): refer to cash flow directions as "Cash Inflow" and "Cash Outflow", never as "Income" or "Expense". Flag ambiguity if inflow vs outflow cannot be distinguished.

    # suspend_routes: [1]
    # suspension_reason_path: "ambiguity_reason"

  - id: commit_mapped_columns
    activity_type: workers.database.insert_rows
    negotiate: false
    timeout: "10s"
    description: "Inserts the mapped rows into Postgres DB as PENDING."
    depends_on:
      - map_columns
    # route_condition:
    #   step_id: map_columns
    #   values: [0]

  - id: run_enrichment
    activity_type: workers.database.enrich_rows
    negotiate: false
    timeout: "120s"
    description: "Legacy enrichment step that maps strings to DB entities, outputs ENRICHED events."
    depends_on:
      - commit_mapped_columns
